    - required_repository_CI_green
    - architecture_validation_green
    - immutable_contract_tests_green
    - deterministic_identity_tests_green
    - stage_required_replay_tests_green
    - relevant_strategy_runtime_integration_tests_green
    - Worker_self_review_complete
    - Manager_stop_status_CLEAR
    - no_known_sprint_invariant_violation
    - no_non_delegable_change
    - no_unresolved_blocking_issue
    - branch_protection_not_bypassed
  missing_skipped_unavailable_or_failing_gate: blocks_merge

validation:
  required_before_every_delegated_merge:
    - focused_changed_behavior_tests
    - full_pytest
    - changed_file_ruff
    - mypy_for_changed_owners
    - architecture_validation
    - immutable_contract_validation
    - deterministic_identity_validation
    - stage_required_provider_free_replay_validation
    - governance_integrity_validation
    - lean_entrypoint_validation
    - git_diff_check
  final_exact_main:
    - full_test_suite
    - architecture_validation
    - immutable_contract_validation
    - deterministic_identity_validation
    - provider_free_replay_validation
    - fourth_strategy_modularity_proof
    - production_equivalent_scheduled_execution_non_mutating
    - production_equivalent_API_execution_non_mutating
    - zero_migrated_strategy_owned_acquisition
    - no_live_legacy_migrated_path
    - no_duplicate_generic_owner_or_subsystem
    - no_sprint_created_temporary_compatibility_code
    - clean_repository

stop_conditions:
  - frozen_governance_change_required
  - protected_architecture_or_domain_contract_redefinition_required
  - scope_expansion_required
  - risk_floor_reduction_required
  - deployment_required
  - sprint_completion_impossible_inside_approved_architecture

founder_interaction:
  routine_progress: prohibited
  next_normal_contact: closure_packet_after_exact_main_verification
  hard_blocker_packet_only_for: stop_conditions

definition_of_done:
  - all_three_production_strategies_use_one_generic_read_only_fact_runtime
  - reusable_calculations_are_named_versioned_immutable_facts
  - no_strategy_facing_execution_object_exposes_acquisition
  - equivalent_evidence_and_facts_are_reused
  - migrated_evaluations_replay_without_providers
  - fourth_strategy_requires_no_generic_runtime_or_acquisition_change
  - superseded_migrated_acquisition_code_deleted
  - exact_current_main_passes_all_final_validation

closure_packet:
  required:
    - final_main_SHA
    - merged_PRs
    - exact_main_full_test_results
    - architecture_validation
    - replay_result
    - fourth_strategy_proof
    - all_three_read_only_fact_path_proof
    - strategy_owned_acquisition_absence_proof
    - legacy_path_deletion_proof
    - non_sprint_observations
    - next_sprint_recommendation

successor_boundary:
