activation:
  id: AMD-013-SPRINT-013-V1.1
  governance_amendment: GOV-AMD-001-013
  founder_authorized: true
  founder_direction: >
    Expand SPRINT-013 to complete data-fidelity recovery, production closeout,
    provider-neutral freshness and logging fixes, and a mandatory modularity audit.
    Reusable acquisition, persistence, analytics, gate primitives, diagnostics,
    budgeting, caching, and projection belong in core/shared layers. Strategy
    packages remain declarative policy and composition surfaces.
  effective_when: this version is Founder-merged to the default branch
  delegate:
    role: ROLE-WORKER
    instance: implementation-worker
  limited_to_sprint: SPRINT-013
