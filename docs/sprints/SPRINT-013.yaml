      - reusable_time_alignment_and_completeness_rules
      - comparison_universe_return_inputs
      - canonical_sector_mapping_and_benchmark_inputs
      - analytics_owned_zscore_percentile_and_relative_return_formulas
      - prospective_accumulation_when_truthful_history_is_unavailable
    hard_rules:
      - no_synthetic_or_repeated_current_chain_backfill
      - no_private_strategy_database
      - no_adapter_owned_financial_formula
      - no_guessed_peers_or_sector_mapping
      - preserve_60_observation_lookback_and_40_valid_minimum
    acceptance:
