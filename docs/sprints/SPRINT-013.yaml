---
id: SPRINT-013
name: Signal Trust, Data Fulfillment, and Operator Observability
version: 1.0
status: SCOPED
type: IMPLEMENTATION_SPRINT
baseline_commit: b4741975a662fe311fcb52dfab1883e35ff4182a

activation:
  id: AMD-013-SPRINT-013
  governance_amendment: GOV-AMD-001-013
  founder_authorized: true
  founder_direction: SPRINT-013-OVERNIGHT-WORK-PACKAGE
  effective_when: this sprint definition is Founder-merged to the default branch
  delegate:
    role: ROLE-WORKER
    instance: implementation-worker
  limited_to_sprint: SPRINT-013
  approved_tickets:
    - S13-00
    - S13-01
    - S13-02
    - S13-03
    - S13-04
    - S13-05
    - S13-06
    - S13-07
  expires:
    - sprint_complete
    - sprint_stopped
    - Founder_revokes_delegation

objective: >
  Make screening classifications truthful, missing-data results attributable
  to secret-safe causes, provider requests bounded and observable, required
  Skew Momentum evidence canonical, and operator-visible results auditable.

bounded_scope:
  in:
    - fail_closed_skew_momentum_directional_verdicts
    - capability_level_acquisition_diagnostics
    - quota_window_aware_request_accounting
    - scheduled_cycle_fact_reuse_and_request_deduplication
    - canonical_skew_history_peer_and_sector_evidence_foundation
    - generic_operator_readable_strategy_outputs
    - generic_read_only_deployment_identity
    - fixture_and_production_validation
  out:
    - new_strategies
    - strategy_threshold_changes_to_manufacture_signals
    - fabricated_history_or_proxy_evidence
    - symbol_specific_production_branches
    - provider_priority_changes_without_Founder_decision
    - provider_payload_or_secret_exposure
    - execution_orders_sizing_or_portfolio_mutation
    - brokerage_changes
    - governance_or_constitution_changes
    - frozen_architecture_redefinition
    - deployment
    - sprint_scope_expansion

execution:
  mode: founder_authorized_autonomous_sprint
  branch_strategy: bounded_workstream_prs
  workflow:
    - implement_one_approved_ticket
    - run_required_validation
    - perform_and_record_self_review
    - open_or_update_pull_request
    - verify_pull_request_scope_and_required_checks
    - merge_only_when_every_Amendment_013_gate_is_green
    - verify_default_branch_contains_merge_commit
    - run_post_merge_validation
    - continue_next_unblocked_ticket

authority:
  ultimate: Founder
  delegate:
    role: ROLE-WORKER
    instance: implementation-worker
    may:
      - implement_enumerated_tickets
      - add_tests_and_internal_documentation
      - perform_bounded_contract_preserving_refactors
      - create_and_update_pull_requests
      - execute_validation_and_self_review
      - create_non_blocking_GitHub_issues
      - merge_enumerated_implementation_pull_requests_after_all_gates_pass
      - verify_main_and_continue_to_next_ticket
    may_not:
      - merge_this_activation_or_any_governance_change
      - merge_architecture_or_constitution_changes
      - bypass_branch_protection_or_required_checks
      - merge_with_missing_skipped_failing_or_unavailable_gates
      - lower_risk_or_expand_scope
      - deploy

tickets:
  - id: S13-00
    title: Activate sprint and freeze baseline
  - id: S13-01
    title: PATCH-012C fail-closed Skew Momentum verdicts
  - id: S13-02
    title: Capability-level acquisition diagnostics
  - id: S13-03
    title: Quota-window-aware acquisition and fact reuse
  - id: S13-04
    title: Wire full-fidelity Skew Momentum evidence
  - id: S13-05
    title: Operator-readable strategy fields
  - id: S13-06
    title: Deployment identity and UI trust strip
  - id: S13-07
    title: Production validation and registry closeout

validation:
  required_before_every_delegated_merge:
    - all_required_CI_checks_pass
    - full_pytest_passes
    - changed_file_ruff_passes
    - mypy_asa_passes
    - architecture_validation_passes
    - deterministic_replay_validation_passes
    - immutable_contract_validation_passes
    - deterministic_identity_validation_passes
    - governance_integrity_validation_passes
    - lean_entrypoint_validation_passes
    - secret_scan_passes
    - git_diff_check_passes
    - self_review_passes
    - no_unresolved_blocking_issue_or_governance_gate
    - pull_request_contains_only_approved_ticket_scope
  post_merge:
    - verify_default_branch_contains_merge_commit
    - run_ticket_validation_from_default_branch
    - verify_worktree_clean

self_review:
  required: true
  checklist:
    - facts_derived_facts_and_strategy_policy_boundaries_preserved
    - UNKNOWN_never_replaced_with_proxy_or_positive_evidence
    - provider_payloads_credentials_and_unsafe_quota_details_absent
    - no_threshold_or_provider_priority_change
    - deterministic_outputs_and_accounting_preserved
    - Constitution_and_frozen_governance_unchanged

stop_conditions:
  - frozen_governance_or_architecture_change_required
  - product_policy_or_provider_priority_decision_required
  - truthful_historical_or_sector_source_missing
  - new_paid_service_credential_or_license_decision_required
  - breaking_public_or_domain_contract_required
  - validation_gate_cannot_be_resolved_within_ticket_scope
  - credential_or_provider_payload_exposure_detected
  - sprint_complete_or_Founder_revokes_delegation

merge_policy:
  activation_merge_authority: Founder_only
  implementation_merge_authority: active_Amendment_013_delegate
  auto_merge_when_all_required_gates_pass: true
  deployment_authority: Founder_only
