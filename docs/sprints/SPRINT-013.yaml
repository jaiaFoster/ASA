      - supported_symbols_evaluate_or_fail_with_specific_truthful_reason
      - strategy_thresholds_and_policy_are_unchanged
      - reusable_fixes_land_in_core_not_earnings_specific_adapters

  S13-07:
    title: Production validation and issue closeout
    priority: P0.parallel
    implementation_blocking: false
    covers:
      - issue_246_scheduler_verification
      - issue_247_temporal_verification
      - issue_244_Forward_Factor_closeout
      - UI_and_deployment_smoke
    required_work:
      - verify_deployed_release_identity
      - verify_UI_static_assets_health_readiness_and_GET_only_behavior
      - observe_two_consecutive_due_cycles
      - reconcile_expected_attempted_completed_failed_and_skipped_pairs
      - prove_overdue_rows_do_not_report_live_without_evidence
      - rerun_previously_failing_Forward_Factor_symbols
      - update_or_close_issues_only_when_original_acceptance_is_met
    acceptance:
      - every_expected_pair_is_attempted_or_has_an_explicit_skip_reason
      - no_unexplained_strategy_exception_remains
      - temporal_status_matches_exposed_timestamps
      - UI_renders_exact_API_semantics_and_release_identity
      - zero_PASS_is_not_treated_as_failure

  S13-10:
    title: Provider-neutral quote and option-chain freshness
    priority: P1.1
    issue: 162
    depends_on: [S13-02]
    required_work:
      - define_observation_level_quote_and_chain_freshness_semantics
      - stop_one_contract_last_trade_from_owning_whole_chain_freshness
      - distinguish_last_trade_time_quote_time_response_time_and_session_state
      - implement_provider_neutral_policy_and_provider_adapter_mapping
    acceptance:
      - valid_chain_is_not_rejected_by_arbitrary_first_row_timestamp
      - after_hours_quote_behavior_is_explicit_and_tested
      - stale_data_remains_fail_closed
      - no_strategy_specific_freshness_exception_exists

  S13-11:
    title: Structured sanitized exception detail
    priority: P1.2
    issue: 242
    depends_on: [S13-02]
    required_fields:
      - exception_type
      - component_id
      - strategy_id
      - capability_id
      - safe_error_code
      - request_id
    acceptance:
      - unexpected_internal_defects_are_diagnosable_in_structured_logs_or_ops_records
      - normalized_provider_failures_use_acquisition_outcomes_not_exception_text
      - no_credentials_payloads_headers_secret_URLs_or_unrestricted_messages_escape
      - public_result_contract_remains_safe

