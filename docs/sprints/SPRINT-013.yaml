executive_objective: >
  Make every screening result attributable to truthful canonical evidence,
  provider and budget behavior, reusable derived calculations, and
  strategy-owned policy. Resolve known data-fidelity defects at their earliest
  shared boundary, keep all non-strategy-specific behavior modular and reusable
  for future strategies, and prove the deployed product through consecutive
  production cycles.

success_definition:
  every_result_is_one_of:
    - evaluated_successfully
    - legitimately_ineligible
    - specific_missing_capability
    - specific_provider_failure
    - specific_normalization_failure
    - specific_budget_deferral
    - specific_stale_data_rejection
    - specific_internal_defect
  modularity:
    - shared_behavior_is_implemented_once_in_the_correct_core_layer
    - strategy_files_are_declarative_policy_and_composition_surfaces
    - future_strategies_can_reuse_data_history_gates_diagnostics_and_budgeting
    - no_strategy_ID_symbol_or_provider_branches_in_generic_layers
  production:
    - two_consecutive_cycles_account_for_every_expected_pair
    - UI_and_API_show_exact_deployed_identity_and_result_semantics
    - zero_unexplained_strategy_exceptions
  note: PASS_occurrence_is_not_required

architecture_philosophy:
  canonical_flow:
    - market_data_and_domain_own_provider_neutral_facts_provenance_and_freshness
    - persistence_owns_durable_history_and_attempt_records
    - analytics_owns_pure_reusable_derived_facts_and_formula_versions
    - shared_components_own_reusable_typed_gate_and_structure_primitives
    - strategy_manifests_own_parameters_requirements_thresholds_weights_policy_composition_direction_structure_selection_and_verdict
    - screening_owns_generic_orchestration_only
    - strategy_runtime_owns_generic_execution_persistence_translation_and_projection_only
    - UI_renders_API_truth_without_reconstruction
  strategy_file_rule: >
    Strategy packages may declare thesis, requirements, parameters, graph
    composition, thresholds, weights, strategy-specific eligibility policy,
    direction, structure selection, reasons, and verdict. Provider access,
    storage, generic calculations, generic history, reusable gate mechanics,
    budgeting, caching, diagnostics, and API/UI reconstruction are forbidden.
  core_rule: >
    Anything semantically reusable by another strategy belongs in the correct
    core/shared layer, not necessarily one monolithic package. Extract only
    after semantic identity is proven; do not create speculative abstractions.
  one_owner_per:
    - canonical_fact
    - formula
    - history_series
    - gate_primitive
    - strategy_policy
    - verdict
    - provider_attempt
    - freshness_decision
    - request_budget

operating_directives:
  root_cause:
    mandatory: true
    rules:
      - trace_from_observed_failure_to_earliest_shared_failing_boundary
      - fix_the_owner_not_the_downstream_symptom
      - do_not_mask_failures_with_generic_missing_data
      - do_not_special_case_symbols_strategies_or_providers_in_shared_code
      - add_provider_shaped_or_production_shaped_regressions
      - update_existing_issue_before_creating_a_duplicate
  modularity_gate:
    mandatory_before_every_implementation_PR: true
    questions:
      - is_this_behavior_financial_policy_unique_to_one_strategy
      - can_another_strategy_need_the_same_fact_formula_history_gate_or_diagnostic
      - does_an_equivalent_owner_already_exist
      - would_this_change_duplicate_calculation_or_persistence
      - is_the_proposed_interface_provider_neutral_and_strategy_neutral
    required_actions:
      - use_existing_core_contract_when_available
      - place_new_reusable_behavior_in_the_correct_core_or_shared_component_layer
      - keep_strategy_manifest_changes_to_declarations_parameters_and_policy_composition
      - add_architecture_test_for_any_new_boundary
      - preserve_compatibility_or_raise_blocker_before_breaking_a_frozen_contract
  token_efficiency:
    mandatory: true
    rules:
      - inspect_current_code_and_issue_state_before_explaining
      - use_one_concise_issue_comment_per_workstream_milestone
      - do_not_repeat_repository_history_or_full_test_logs
      - report_only_root_cause_changed_behavior_evidence_blocker_and_next_action
      - use_targeted_tests_during_iteration_and_one_required_full_gate_before_merge
      - reuse_existing_contracts_fixtures_and_helpers
      - avoid_duplicate_docs_parallel_paths_and_speculative_abstractions
  continuity:
    mandatory: true
    rules:
      - continue_to_next_unblocked_ticket_without_routine_Founder_review
      - run_production_verification_in_parallel_with_implementation
      - auto_merge_when_all_ticket_and_Amendment_013_gates_pass
      - stop_only_for_sprint_completion_or_a_true_Founder_required_blocker

merge_policy:
  activation_or_scope_change_merge_authority: Founder_only
  implementation_merge_authority: active_Amendment_013_delegate
  auto_merge: true
  merge_when:
    - ticket_acceptance_criteria_met
    - all_required_CI_checks_pass
    - required_tests_pass
    - modularity_and_architecture_gates_pass
    - no_unresolved_high_risk_finding
    - migration_has_upgrade_and_downgrade_evidence_when_applicable
    - rollback_and_production_verification_notes_exist
    - self_review_is_recorded_concisely
  founder_review_required_only_for:
    - sprint_scope_expansion
    - governance_or_frozen_architecture_change
    - public_or_domain_contract_break
    - provider_priority_paid_service_license_or_credential_decision
    - destructive_change_outside_scope
    - truthful_data_source_or_backfill_policy_decision
    - blocker_with_no_authorized_technical_resolution
  deployment_authority: Founder_only

