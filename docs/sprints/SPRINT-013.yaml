workstreams:
  S13-08:
    title: Strategy modularity and core ownership audit
    priority: P0.0
    objective: >
      Audit production strategy, component, adapter, analytics, market-data,
      persistence, and projection code; identify behavior living in strategy
      files that is actually reusable core behavior; fix bounded verified
      ownership defects before they are copied into more strategies.
    audit_scope:
      - strategies
      - strategy_runtime
      - screening
      - analytics
      - market_data
      - asa_integrations_and_API_projection
    classification:
      - KEEP_STRATEGY_POLICY
      - KEEP_DECLARATIVE_MANIFEST
      - MOVE_CORE_FACT_OR_NORMALIZATION
      - MOVE_CORE_PERSISTENCE_OR_HISTORY
      - MOVE_CORE_ANALYTICS
      - MOVE_SHARED_COMPONENT_OR_GATE_PRIMITIVE
      - MOVE_SCREENING_ORCHESTRATION
      - MOVE_GENERIC_PROJECTION
      - REMOVE_DUPLICATE
      - UNKNOWN_REQUIRES_ARCHITECT_OR_FOUNDER
    required_work:
      - inventory_significant_operations_not_every_line
      - identify_duplicate_or_private_implementations_of_shared_concepts
      - verify_strategy_files_have_no_provider_DB_network_budget_or_cache_ownership
      - verify_reusable_formulas_have_one_versioned_owner
      - verify_reusable_gate_mechanics_are_typed_shared_components
      - verify_manifests_remain_the_strategy_semantic_authority
      - move_only_verified_misplaced_behavior_in_bounded_PRs
      - add_architecture_tests_preventing_regression
    acceptance:
      - concise_audit_matrix_is_recorded
      - every_remaining_strategy_operation_is_justified_as_policy_or_composition
      - verified_shared_logic_is_moved_to_the_correct_core_layer
      - no_duplicate_calculation_or_persistence_path_remains_in_touched_scope
      - existing_strategy_results_and_deterministic_identities_are_preserved_or_versioned
      - broad_refactor_is_not_used_as_a_substitute_for_evidence

  S13-02:
    title: Durable acquisition attempts and screening-cycle identity
    priority: P0.1
    depends_on: [S13-08]
    ownership:
      market_data: attempt_contract_and_normalized_outcomes
      screening: cycle_and_pair_evaluation_identity
      integrations: PostgreSQL_repository_and_migration
      market_data_ops: operations_token_read_queries_and_summaries
      strategy_runtime: safe_generic_reason_codes_only
    required_identity:
      - screening_cycle_id
      - pair_evaluation_id
      - attempt_id
    normalized_outcomes:
      - success
      - upstream_rate_limited
      - local_quota_exhausted
      - empty_payload
      - no_matching_data
      - stale_data
      - incomplete_data
      - malformed_payload
      - entitlement_unavailable
      - transport_failure
      - fallback_exhausted
    acceptance:
      - attempts_are_append_only_and_deterministically_ordered
      - cycle_pair_provider_capability_outcome_and_time_queries_exist
      - operations_routes_are_hidden_by_existing_token_behavior
      - public_results_receive_only_safe_generic_reason_codes
      - fallback_success_and_failure_are_distinct
      - in_memory_and_PostgreSQL_semantics_match
      - raw_payloads_headers_credentials_and_unrestricted_exceptions_are_absent

  S13-03A:
    title: Rolling provider quota correctness
    priority: P0.2
    depends_on: [S13-02]
    required_work:
      - monotonic_rolling_request_windows
      - provider_specific_limits_and_window_duration
      - separate_concurrency_burst_and_total_ceilings
      - bounded_retry_backoff_and_cooldown
      - safe_reset_hint_handling
      - cycle_level_sanitized_accounting
      - pair_isolation
    acceptance:
      - microsecond_separated_requests_obey_the_same_active_window
      - window_expiry_restores_allowance_deterministically
      - providers_have_independent_accounting
      - upstream_and_local_refusal_remain_distinct
      - retry_and_fallback_units_are_recorded
      - no_unconfigured_provider_plan_limit_is_invented

  S13-03B:
    title: Cycle-scoped request reuse
    priority: P0.3
    depends_on: [S13-02, S13-03A]
    required_work:
      - verify_fulfillment_service_lifetime_matches_cycle_scope
      - deduplicate_exact_capability_requests
      - reuse_stable_earnings_and_history_facts_when_identity_and_freshness_match
      - bypass_stale_incomplete_or_policy_mismatched_cache_entries
      - expose_reuse_and_skip_counts_in_cycle_summary
    acceptance:
      - provider_calls_approximate_unique_valid_requests
      - requests_differing_by_subject_capability_window_expiration_parameters_or_freshness_do_not_collide
      - no_cross_symbol_reuse
      - option_chain_and_quote_reuse_never_exceeds_declared_freshness
      - strategies_do_not_own_or_access_provider_caches

  S13-04:
    title: Shared historical evidence foundation
    priority: P0.4
    depends_on: [S13-08]
    objective: >
      Provide reusable provider-neutral historical observation storage, query,
      alignment, and analytics inputs. Skew Momentum is the first consumer, not
