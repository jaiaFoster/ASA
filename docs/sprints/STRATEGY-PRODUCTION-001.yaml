  - xs_option_zhan_neg_lnprice_dn_call
  - xs_option_heston_straddle_momentum_lowcost
  - index_buywrite_cboe_bxm

north_star:
  production: >
    All seven selected strategies are first-class production strategies. A due
    strategy either evaluates truthfully or emits a typed blocker; it is never
    silently dropped, proxied, or held outside production.
  architecture: >
    Shared behavior is built once at its canonical owner. A second strategy
    consuming a primitive proves reuse rather than creating a parallel path.
  evidence: >
    Production measures constructibility, opportunity frequency, provider/data
    adequacy, and forward outcomes. Production results never rewrite source
    evidence or convert implementation assumptions into research facts.

canonical_flow:
  - market_data_owns_provider_neutral_canonical_facts_provenance_and_freshness
  - analytics_owns_named_typed_versioned_reusable_derived_facts
  - StrategyManifest_is_the_only_authored_strategy_authority
  - strategy_graph_owns_parameters_gates_direction_structure_score_and_verdict
  - screening_owns_generic_acquisition_planning_and_orchestration_only
  - strategy_runtime_owns_generic_execution_persistence_projection_and_replay
  - trade_proposal_uses_exact_selected_positions
  - tracking_and_outcomes_reuse_existing_generic_lifecycle

architecture_contract_freeze:
  status: FROZEN_FOR_THIS_SPRINT
  authority: ROLE-ARCH
  rule: >
    Workers implement these additive, reusable semantics. They do not choose a
    different ownership model or redefine the financial meaning. Departure from
    this freeze requires Architect correction; only a necessary protected
    breaking contract or product-direction change escalates to the Founder.

  three_state_semantics:
    owner: shared_strategy_components_and_graph_runtime
    values: [PASS, FAIL, UNKNOWN]
    invariants:
      - UNKNOWN_is_not_boolean_false
      - boolean_AND_returns_FAIL_if_any_input_FAIL
      - boolean_AND_returns_UNKNOWN_if_no_FAIL_and_any_input_UNKNOWN
      - boolean_AND_returns_PASS_only_if_all_inputs_PASS
      - verdict_projection_preserves_UNKNOWN_distinct_from_FAIL_PASS_and_WATCH
      - adapters_screening_persistence_API_and_UI_must_not_reinterpret_UNKNOWN

  X01_index_identity_and_settlement:
    owner: domain_and_market_data
    additive_contract:
      - canonical_INDEX_instrument_kind_distinct_from_EQUITY
      - index_option_identity_includes_underlying_index_root_and_contract_identity
      - option_identity_carries_settlement_style_when_semantically_relevant
      - AM_PM_settlement_distinction_is_typed
      - SOQ_or_equivalent_settlement_value_is_a_canonical_observation
      - provider_neutral_INDEX_quotes_use_the_shared_quote_contract
    prohibitions:
      - normalize_SPX_to_EQUITY
      - infer_settlement_style_from_strategy_ID
      - substitute_SPY_or_futures

  P03_straddle:
    owner: reusable_structure_component_and_exact_position_contract
    additive_contract:
      - one_or_more_call_put_pairs
      - each_pair_same_strike_and_expiration
      - long_or_short_direction
      - decimal_quantity_per_leg
      - unit_or_non_unit_ratio
      - deterministic_exact_option_identity
      - deterministic_pair_and_position_ordering
      - multi_pair_collection_supported_without_strategy_specific_structure_type
    identity: >
      Position identity includes exact contracts, signed quantities, and any
      assumption-controlled weighting inputs that change the position.

  P09_underlying_exposure_overlay:
    owner: reusable_portfolio_structure_contract
    additive_contract:
      - generic_underlying_exposure_leg_separate_from_option_legs
      - exposure_leg_has_subject_identity_quantity_or_notional_and_exposure_kind
      - exposure_kind_may_represent_non_tradable_index_total_return_exposure
      - option_legs_preserve_exact_contract_identity
      - overlay_economics_do_not_claim_broker_executability_for_non_tradable_exposure
    BXM_rule: >
      BXM uses S&P 500 index total-return exposure plus the exact SPX short call.
      It is an analytical/index strategy representation, not a claim that ASA
      can buy the index itself.
    prohibitions:
      - represent_SPX_index_as_owned_equity
      - substitute_SPY
      - substitute_ES_or_other_futures
      - BXM_named_runtime_type

  P10_delta_hedged_option:
    owner: reusable_portfolio_structure_contract
    additive_contract:
      - exact_option_leg
      - static_underlying_hedge_leg_for_selected_strategies
      - signed_decimal_hedge_quantity_from_named_derived_fact
      - long_or_short_option_direction
      - deterministic_combined_position_identity
    boundary: >
      Dynamic re-hedging is not part of this sprint's P10 contract unless a
      selected manifest explicitly requires it. Zhan uses a static formation hedge.

  P12_cross_sectional_portfolio:
    owner: generic_cross_subject_portfolio_composition
    additive_contract:
      - point_in_time_eligible_universe_identity
      - deterministic_rank_and_quantile_assignment
      - explicit_tie_policy
      - exact_member_position_identity
      - source_defined_equal_or_value_weighting
      - long_short_or_single_side_book
      - rebalance_effective_time
    prohibition:
      - strategy_ID_branch_in_cross_sectional_orchestration

  A15_margin_and_capital:
    owner: analytics
    additive_models:
      - cash_secured_short_put_collateral
      - Treasury_collateral_accrual
      - Cboe_naked_option_margin
      - Cboe_straddle_combination_margin
      - source_required_equity_option_margin
      - Heston_SPAN_style_scenario_margin_or_explicit_UNKNOWN_if_exact_inputs_unavailable
    invariants:
      - formula_ID_and_version_required
      - source_or_rule_provenance_required
      - no_terminal_max_loss_substitution_for_margin
      - missing_margin_input_returns_UNKNOWN

  implementation_assumption_provenance:
    owner: StrategyManifest_metadata_and_generic_explanation_projection
    additive_contract:
      - implementation_assumption_ids_are_manifest_identity_bearing_metadata
      - assumption_values_that_change_financial_semantics_are_manifest_parameters
      - replay_identity_includes_semantics_changing_assumption_values
      - explanation_projection_discloses_material_assumption_IDs
      - source_provenance_never_labels_an_RA_item_as_source_authored
      - changing_semantics_changing_assumption_requires_strategy_semantic_version_change

hard_architecture_rules:
  - no_strategy_ID_branches_in_market_data_screening_runtime_API_or_UI
  - no_provider_access_inside_strategies_or_analytics
  - no_private_strategy_formula_when_semantically_reusable
  - no_duplicate_formula_owner
  - no_strategy_specific_runtime_structure_type
  - no_OptionContract_mark_substitution_for_bid_ask_midpoint
  - no_live_broker_mutation
  - no_proxy_market_data_or_underlying_substitution_without_source_authority
  - exact_source_rules_and_ASA_constructibility_policy_remain_separate

research_assumptions:
  IDs: [RA-EV-01, RA-EV-02, RA-SV-01, RA-XS-01, RA-XR-03]
  enforcement:
    - IDs_present_in_manifest_or_strategy_provenance
    - semantics_changing_values_parameterized
    - replay_identity_changes_when_semantics_change
    - explanation_output_discloses_material_assumptions
    - semantic_version_changes_when_semantics_changing_assumption_changes
    - RA_XR_03_only_promoted_to_DERIVED_with_checked_explicit_proof

live_in_production_contract:
  definition: >
    A selected strategy is LIVE_IN_PRODUCTION only when all six conditions are
    true. PASS or an actionable trade is not required.
  conditions:
    - manifest_and_runtime_projection_are_merged_in_the_real_production_registry
    - normal_scheduler_or_source_faithful_event_path_exists
    - every_due_required_capability_is_really_attempted_or_generically_capacity_deferred
    - graph_executes_to_truthful_verdict_or_typed_missing_data
    - generic_API_UI_projection_exposes_the_result
    - tracking_and_outcome_paths_accept_the_strategy_when_an_actionable_position_exists
  Monday_states:
    - LIVE_EVALUABLE
    - LIVE_TYPED_DATA_BLOCKER
    - NOT_DUE
  prohibited_interpretation: >
    "Live" never means fabricated history, guessed provider values, forced PASS,
    proxy instruments, or bypassed validation.

operating_model:
  one_sprint: true
  strategy_by_strategy_Founder_stops: prohibited
  no_lull: >
    When authorized dependency-safe work exists, continue. Provider waits,
    observation windows, architecture corrections, and one strategy's blocker
    do not idle unrelated tickets.
  WIP:
    implementation_or_correction_streams: 2
    observation_streams: unbounded_within_sprint
  root_cause_policy:
    first_failure:
      - reproduce_exact_failure
      - identify_earliest_shared_owning_boundary
      - fix_owner_not_downstream_symptom
      - add_provider_or_production_shaped_regression
      - rerun_same_proof
    repeated_same_failure:
      - stop_micro_patching
      - restate_violated_acceptance
      - challenge_the_assumption_or_contract
      - raise_Architect_blocker_if_required
  token_efficiency:
    - inspect_current_owner_before_designing
    - use_targeted_tests_during_iteration
    - run_full_required_gate_once_before_merge
    - one_concise_PR_evidence_packet
    - no_duplicate_status_docs
    - no_repetition_of_research_history_unless_needed_for_a_rule

