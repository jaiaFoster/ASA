objective: >
  Build the reusable data, analytics, structure, capital, and portfolio
  capabilities required by the seven frozen research-selected strategies;
  implement every strategy through ASA's manifest-first architecture; merge
  qualifying child-ticket PRs continuously under Founder Sprint Delegation;
  integrate every selected strategy into the real production registry,
  scheduler, product, tracking, and outcomes paths; and obtain real production
  observations without shelving any selected strategy.

selected_strategies:
  - event_vol_gxz_preea_straddle_to_expiry
  - index_putwrite_cboe_put
  - index_putwrite_cboe_puty
