  strategy_streams:
    A: [SP-02A, SP-02B, SP-04A, SP-04B]
    B: [SP-03A, SP-03B, SP-03C]
    C: [SP-05A, SP-05B, SP-05C, SP-05D]
    D: [SP-06A, SP-06B]
  convergence: [SP-07A, SP-07B, SP-08A]
  rule: >
    Dependencies govern start, not package numbering. Continue any unblocked
    child ticket while another waits on provider evidence, review, or observation.

merge_policy:
  final_activation_merge_authority: Founder_only
  implementation_merge_authority_after_activation: active_Amendment_013_delegate
  branch_protection_bypass: prohibited
  auto_merge: enabled_for_qualifying_child_ticket_PRs
  each_PR_must_name_exactly_one_primary_ticket: true
  bounded_corrective_PR_may_reference_same_ticket: true
  merge_when:
    - enumerated_ticket
    - dependencies_merged
    - in_scope_only
    - required_CI_green
    - relevant_truth_tables_green
    - architecture_validation_green
    - deterministic_replay_green
    - immutable_contract_and_identity_validation_green
    - provider_free_replay_green
    - focused_and_required_full_tests_green
    - migration_upgrade_downgrade_green_when_applicable
    - secret_scan_green
    - self_review_complete
    - no_unresolved_blocking_review
    - no_true_Founder_blocker
  deployment_authority: Founder_only

validation:
  per_PR:
    - focused_behavior_tests
    - strategy_truth_tables_when_applicable
    - provider_shaped_normalization_tests_when_applicable
    - deterministic_replay
    - exact_position_identity
    - architecture_boundary_tests
    - Ruff_changed_scope
    - mypy_changed_scope
    - repository_required_CI
    - frontend_tests_if_product_surface_changes
    - migration_upgrade_downgrade_if_schema_changes
    - lean_integrity_and_entrypoints
    - concise_self_review
  every_strategy:
    - manifest_single_authored_authority
    - all_market_capabilities_declared
    - formula_IDs_and_versions
    - PASS_FAIL_UNKNOWN_vectors
    - deterministic_exact_position_selection
    - exact_trade_proposal
    - assumption_provenance
    - no_hidden_adapter_financial_policy
    - no_strategy_named_generic_branch
    - provider_free_replay
    - registry
    - scheduler_or_event_path
    - API_UI_projection
    - tracking_outcome_compatibility
  closure:
    - every_child_ticket_merged
    - full_suite_green
    - architecture_suite_green
    - seven_strategy_replay_matrix_green
    - capacity_release_gate_green
    - exact_main_release_identity
    - Founder_deployment_completed
    - one_real_post_release_session_observed
    - all_seven_classified_LIVE_EVALUABLE_LIVE_TYPED_DATA_BLOCKER_or_NOT_DUE
    - zero_unexplained_strategy_exception
    - no_selected_strategy_shelved

blocker_policy:
  worker_continues_without_Founder_for:
    - ordinary_test_failure
    - implementation_defect
    - in_scope_provider_adapter_bug
    - typed_missing_data
    - capacity_deferral
    - Architect_correction_within_frozen_semantics
    - reversible_migration_correction
    - observation_wait
  true_Founder_blockers:
    - governance_change
    - material_product_direction_change
    - new_paid_vendor_or_money_commitment
    - live_broker_authority_expansion
    - destructive_or_irreversible_action
    - required_protected_breaking_contract_outside_frozen_additive_semantics
    - production_deployment
    - material_scope_expansion
    - irreconcilable_governance_conflict
  required_packet:
    - exact_blocked_action
    - ticket_and_strategy
    - root_cause
    - evidence
    - attempted_in_scope_resolution
    - independent_work_that_continues
    - narrowest_Founder_decision

authority:
  worker:
    may:
      - implement_enumerated_child_tickets
      - perform_bounded_root_cause_corrections
      - create_update_and_auto_merge_qualifying_PRs_after_activation
      - add_reversible_migrations
      - register_schedule_and_integrate_all_seven
      - continue_to_next_dependency_safe_ticket
    may_not:
      - activate_sprint
      - expand_selected_strategy_set
      - change_source_financial_rules
      - redefine_architecture_contract_freeze
      - erase_assumption_provenance
      - invent_market_data
      - add_strategy_specific_generic_paths
      - lower_risk_or_validation_floor
      - add_paid_vendor_authority
      - mutate_brokerage
      - deploy
      - change_governance
  architect:
    owns:
      - conformance_to_architecture_contract_freeze
      - R3_architecture_review
      - in_scope_additive_interface_corrections_that_preserve_frozen_semantics
    may_not:
      - change_selected_strategy_financial_policy
      - expand_sprint
      - deploy
  founder:
    retains:
      - final_product_authority
      - activation
      - material_scope_change
      - protected_breaking_contract_acceptance
      - money_vendor_license_commitment
      - live_broker_authority
      - production_deployment
      - governance

completion:
  success: >
    All seven research-selected strategies are first-class production strategies
    using shared reusable capabilities; no selected strategy is shelved; shared
    acquisition is measured and capacity-safe or truthfully deferred; replay,
    identity, assumptions, and UNKNOWN semantics are deterministic; and at least
    one real post-release production session proves truthful participation with
    zero unexplained strategy exceptions.
  delegation_expires_on_completion: true
