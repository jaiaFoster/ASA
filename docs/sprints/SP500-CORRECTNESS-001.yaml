objective: >
  Finish S&P 500 correctness before adding another real strategy. Make
  subject refresh/canonical knowledge the authoritative update boundary so
  every registered strategy projection is recomputed and persisted coherently
  from the same sealed subject snapshot. Resolve or truthfully classify current
  provider-health blockers. End at exact-main READY_FOR_PRODUCTION_PROOF;
  production proof itself is intentionally out of scope.

problem:
  proven:
    - oldest_first_scheduler_and_atomic_subject_claiming_work
