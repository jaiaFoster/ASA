  unresolved:
    - forward_factor_rows_advance_broadly_while_skew_and_earnings_rows_often_do_not
    - latest_result_persistence_may_suppress_fresh_recomputation_when_source_evidence_time_does_not_advance
    - refresh_time_source_evidence_time_and_evaluation_time_are_not_cleanly_separated
    - Alpha_Vantage_rate_limiting_and_Finnhub_authorization_failure_remain_open_in_issue_359
  required_invariant: >
    Refresh is subject/canonical-knowledge owned, never strategy-cadence owned.
    One sealed subject snapshot may contain unchanged legitimate source evidence,
    but every applicable strategy must still receive and persist its fresh
    evaluation from that snapshot.

