architecture:
  temporal_truth:
    subject_snapshot_at: when_the_authoritative_subject_snapshot_was_sealed
    source_observed_at: age_and_usability_of_underlying_market_evidence
    evaluated_at: when_the_strategy_projection_was_recomputed
    persisted_at: when_that_projection_was_committed
    rule: >
      Source evidence chronology may determine usability and whether data
      advanced, but must not silently veto persistence of a newer valid
      evaluation from the current authoritative subject snapshot.
  update_boundary: >
    Scheduler selects subjects. Generic subject planning acquires once, seals
    one immutable snapshot, projects canonical facts, materializes registered
    derived facts, then all applicable strategy consumers evaluate from that
    knowledge. Strategy identity must not control refresh cadence.
  unchanged_evidence: >
    An unchanged earnings event, daily bar, or other legitimate evidence may
    keep source_observed_at unchanged. The fresh evaluation still exists and
    must be persisted; data_advanced_on_last_refresh records whether underlying
    evidence changed.
  persistence: >
    Latest-result ordering must distinguish newer evaluation/snapshot state from
    newer source evidence. No valid fresh recomputation may be silently dropped
    solely because source_observed_at is equal to or older than the stored row.
  canonical_scope: >
    Prefer correction at existing subject preparation/temporal/latest-state
    boundaries. Do not introduce strategy-specific timestamp patches or a
    second acquisition/materialization path.

invariants:
  - one_subject_evidence_boundary
  - one_sealed_snapshot_per_subject_cycle
  - canonical_facts_before_derived_facts
  - derived_facts_named_versioned_and_strategy_neutral_where_reusable
  - all_applicable_strategies_recompute_from_same_current_subject_knowledge
  - scheduling_and_acquisition_are_strategy_neutral
  - unchanged_source_evidence_does_not_mean_unevaluated
  - source_freshness_still_controls_usability_truth
  - no_forced_now_timestamp_to_fake_market_freshness
  - no_strategy_specific_persistence_exceptions
  - compute_once_and_provider_reuse_preserved
  - sibling_failure_isolation_preserved
  - provider_free_replay_preserved
  - Russell_2000_inactive

