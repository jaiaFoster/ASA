frozen_semantics:
  strategy: {id: S001, version: "1.0.0", name: Trend-Gated Sector Momentum}
  universe: point_in_time_eligible_US_sector_ETFs
  momentum: trailing_12_month_total_return
  ranking: descending
  trend: eligible_total_return_equivalent_observation_strictly_above_completed_period_SMA10M
  selection: top_3_ranked_candidates
  portfolio: three_equal_one_third_sleeves
  failed_selected_sleeve: canonical_3_month_Treasury_total_return_research_asset
