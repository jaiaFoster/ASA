    - immutable_target_allocation_decision
    - persistence_and_provider_free_replay
  invariants:
    - strategies_are_provider_blind
    - canonical_facts_precede_derived_facts
    - acquisition_and_runtime_never_branch_on_strategy_id
    - adjustment_and_total_return_semantics_are_explicit
    - unknown_is_never_ranked_as_an_economic_loss
    - selected_trend_failure_routes_only_its_own_sleeve_to_defensive
    - no_silent_fallback_or_structure_substitution
    - no_option_resolver_or_broker_mutation

tickets:
