name: Morning Brief Intake (no AI API)

on:
  schedule:
    - cron: "0 16 * * *" # 09:00 America/Phoenix year-round
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum new briefs to enqueue"
        required: false
        default: "3"

permissions:
  contents: read
  issues: write

concurrency:
  group: morning-brief-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BRIEF_BATCH_SIZE: ${{ inputs.batch_size || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enqueue new or modified briefs as GitHub issues
        run: python tools/morning_brief_agent/run.py
