name: Morning Brief Engineering Agent

on:
  schedule:
    # 09:00 America/Phoenix (MST, UTC-7 year-round)
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum briefs to triage per run"
        required: false
        default: "3"
      issue_only:
        description: "Skip brief intake and work one ready engineering issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: morning-brief-engineer
  cancel-in-progress: false

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRIEF_BATCH_SIZE: ${{ inputs.batch_size || '3' }}
      ISSUE_ONLY: ${{ inputs.issue_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require agent credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set the repository Actions secret OPENAI_API_KEY before enabling this workflow."
            exit 1
          fi
      - name: Install Codex CLI and project development dependencies
        run: |
          npm install -g @openai/codex
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Triage a bounded brief batch or implement one authorized issue
        run: python tools/morning_brief_agent/run.py
