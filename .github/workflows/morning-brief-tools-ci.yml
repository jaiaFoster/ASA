name: Morning Brief Tools CI

on:
  pull_request:
    paths:
      - "tools/morning_brief_agent/**"
      - "tests/tools/morning_brief_agent/**"
      - "claude-morning-briefs/**"
      - "briefs/**"
      - ".github/workflows/morning-brief-*.yml"
  push:
    branches: [main]
    paths:
      - "tools/morning_brief_agent/**"
      - "tests/tools/morning_brief_agent/**"

permissions:
  contents: read
  issues: read # read-only smoke test of the REST client

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8.3,<9"
      - name: Unit tests (intake, ledger, claims, selection, REST client)
        run: python -m pytest tests/tools/morning_brief_agent -q
      - name: Read-only intake dry run against live issues (no writes)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/morning_brief_agent/run.py intake --dry-run --batch 3
