    - 0.1
    - 0.15
    - 0.5
  classes: ROBUST = passes 0.58 under all strong profiles; ROBUST_TO_MODERATE_SHIFTS = passes all moderate but not
    all strong; WEIGHT-SENSITIVE = fails at least one moderate profile
