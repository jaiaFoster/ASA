  architecture: ASA-ARCH-STRATEGY-SELECTION-THRESHOLDS-001 + clarifications (session-supplied; not on main)
method:
  phenomenon_strength: RES-001D §3 start level only; no inconsistency downgrade (Founder scrutiny_bias); no indirectness
    downgrade for the phenomenon (Founder indirect_evidence); bibliographic_only replications not counted
  direction: separate field; UNFAVORABLE families are not credible uses
  credible_use: family with strength >= LOW and direction != UNFAVORABLE
  evidence_confidence_PROPOSED: LOW if >=8 UNKNOWN fields or >=1/3 sources below abstract depth; LOW_MEDIUM if >=5
    UNKNOWN fields or any such sources; else MEDIUM. Research proposal pending Founder approval (Architect clarification
    8).
  unknown: never zero; UNKNOWN evidence carried as interval [0,1]
  pareto_axes:
  - E1 best credible strength
  - E2 its confidence
  - reuse (canonical §3; X-capabilities use enabling_reuse_count)
  - burden (standalone; incremental as sensitivity)
  weighted_normalization: 'anchored ordinal: E1 NONE0/VL.25/L.5/M.75/H1; reuse class L.25/S.5/B.75/P1; burden B0
    1..B4 0; confidence 0..1'
  weighted_profiles_ILLUSTRATIVE:
    equal: E1/3 R1/3 B1/3
    evidence_led: .5/.25/.25
    reuse_led: .25/.5/.25
    burden_averse: .25/.25/.5
    confidence_aware: .4E/.2Conf/.2R/.2B
  sensitivity: 20,000 uniform weight vectors over (E,R,B) simplex; seed 20260927
