# Capability-primitive comparison matrix v2 (governing method: ASA-ARCH-STRATEGY-SELECTION-RESOLUTION-001, Founder-adopted). Raw inputs beneath derived values.
id: ASA-STRATEGY-CAPABILITY-SELECTION-001/primitive-comparison-matrix
version: '2.0'
created: '2026-09-27'
main_basis: 4e56c608b3cc828651f09dc4952cd836b8bdb727
governing_method: 'ASA-ARCH-STRATEGY-SELECTION-RESOLUTION-001, adopted by the Founder (session 2026-09-27): role-stratified
  Pareto -> official weighted scoring -> dependency-aware bundles -> sensitivity classification'
status: Founder consideration set produced. Not a recommendation to implement any capability. No implementation
  authorized.
official_weights:
  direction_adjusted_evidence_utility: 0.35
  independent_credible_cluster_breadth: 0.15
  demonstrated_reuse: 0.25
  implementation_burden: 0.25
normalization:
  strength:
    HIGH: 1
    MODERATE: 0.75
    LOW: 0.5
    VERY_LOW: 0.25
    UNGRADED: interval
  direction:
    FAVORABLE_QUALIFIED: 1
    QUALIFIED: 0.8
    UNRESOLVED: 0.5
    UNFAVORABLE: 0
  evidence_completeness_confidence:
    MEDIUM: 1
    LOW_MEDIUM: 0.8
    LOW: 0.6
    VERY_LOW: 0.35
  reuse_class:
    LOCAL: 0.25
    SHARED: 0.5
    BROAD: 0.75
    PLATFORM: 1
  burden:
    B0: 1
    B1: 0.8
    B2: 0.6
    B3: 0.3
    B4: 0
  architecture_and_reuse_confidence_mod:
    HIGH: 1
    MEDIUM: 0.9
    LOW: 0.75
  breadth: min(distinct non-unfavorable credible evidence clusters / 4, 1)
formula: score = .35*EU + .15*breadth + arch_conf*(.25*reuse*reuse_conf + .25*burden); EU = max over non-unfavorable
  mapped families of strength*direction*completeness
evidence_completeness_confidence: MEDIUM <=4 UNKNOWN fields and no sub-abstract source; LOW_MEDIUM 5-7 or some sub-abstract;
  LOW >=8 or >=1/3 sub-abstract; VERY_LOW ungraded. Contradictions do not reduce completeness.
advancement_rules:
  substantive: lane front <=2 (governing lanes) AND official score >= 0.58 (interval lower bound)
  enabling_contract: 'conditional: lane front 1 AND required by an advancing faithful bundle'
  native: baseline
  bundle: makes >=1 FAVORABLE_QUALIFIED or QUALIFIED family faithfully expressible; components lane front <=2 or
    necessary; mean member official score >= 0.55; replication-only data excluded; shared dependencies charged once
