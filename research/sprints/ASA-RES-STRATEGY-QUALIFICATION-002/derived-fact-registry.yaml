# ---------------------------------------------------------------- index-strategy facts
- fact_id: DF-CBOE-TBILL-DAILY-ACCRUAL
  formula_version: 1.0.0
  formula: >-
    r^i_{t-1} = (1 / (1 - (n/360)·USBR_i))^{(t - (t-1))/n} - 1, with n = 28 for the 4-week bill
    (i = 1) and n = 91 for the 13-week bill (i = 3), USBR = US Treasury bank-discount rate published
    by the US Department of the Treasury, t - (t-1) in calendar days. M^i_t = (1 + r^i_{t-1})·M^i_{t-1}.
    PUTY/WPUT use only the 4-week rate (n = 28). No interest accrues on roll days for PUTY/WPUT.
  inputs:
    - "USBR 4-week"
    - "USBR 13-week"
    - "calendar day count"
  units: simple return per day step
  time_semantics: close-to-close
  missing_behavior: UNKNOWN if the Treasury rate for the date is unavailable
  strategies_using:
    - "ASA-QS-PW-01-CBOE-PUT"
    - "ASA-QS-PW-02-CBOE-WPUT"
    - "ASA-QS-PW-A1-CBOE-PUTY"
  current_ASA_status: NEW_REQUIRES_X04 (rate/discount data)
  source_ids:
    - "CBOE-PUTWRITE-METHODOLOGY-2024"
    - "CBOE-PUTWRITE-INDICES-METHODOLOGY-2024"

- fact_id: DF-CBOE-PUT-CONTRACT-COUNT
  formula_version: 1.0.0
  formula: >-
    Third roll date (the roll that sells an option expiring in March/June/September/December):
    N_new = (Σ_i (1 + r^i_{t-1})·M^i_{t-1} - N_last·max(0, K_old - SOQ_t)) / (K_new/(1 + R3) - P_price).
    Other roll dates: N_new = (M1_Roll + M3_Roll) / (K_new - P_price·(1 + R1)), with
    M1_Roll = max(0, (1 + r^1_{t-1})·M^1_{t-1} - N_last·max(0, K_old - SOQ_t))·(1 + R1) and
    M3_Roll = ((1 + r^3_{t-1})·M^3_{t-1} + min(0, (1 + r^1_{t-1})·M^1_{t-1} - N_last·max(0, K_old - SOQ_t)))·(1 + R3);
    R1, R3 = 1- and 3-month bill returns to the next roll date. N is in index-unit puts
    (multiply by the contract multiplier for contract counts).
  inputs:
    - "T-bill balances M^1"
    - "M^3"
    - "DF-CBOE-TBILL-DAILY-ACCRUAL"
    - "N_last"
    - "K_old"
    - "SOQ_t"
    - "K_new"
    - "P_price"
    - "R1"
    - "R3"
  units: option units
  time_semantics: roll date, after P_price is known
  missing_behavior: UNKNOWN if any input unavailable
  strategies_using:
    - "ASA-QS-PW-01-CBOE-PUT"
  current_ASA_status: NEW_REQUIRES_X04 and A15 (collateral model)
  source_ids:
    - "CBOE-PUTWRITE-METHODOLOGY-2024"

- fact_id: DF-CBOE-BUYWRITE-DAILY-RETURN
  formula_version: 1.0.0
  formula: >-
    Non-roll day: 1 + R_t = (S_t + Div_t - C_t)/(S_{t-1} - C_{t-1}). Roll day: 1 + R_t =
    (1 + Ra)(1 + Rb)(1 + Rc), Ra = (SOQ_t + Div_t - max(0, SOQ_t - K_old))/(S_{t-1} - C_{t-1}) - 1,
    Rb = S_VWAV/SOQ_t - 1, Rc = (S_t - C_t)/(S_VWAV - C_VWAP) - 1. S = index close; C = mean of last
    bid/ask before 4:00 pm ET; Div_t = index-point ex-dividends on t; S_VWAV = volume-weighted index
    value over the same times/weights as the call VWAP (last index value before end of the VWAP
    window if the call does not trade).
  inputs:
    - "S_t"
    - "Div_t"
    - "call bid/ask"
    - "SOQ"
    - "call VWAP"
    - "S_VWAV"
  units: simple daily return
  time_semantics: close-to-close with intraday roll segments
  missing_behavior: UNKNOWN if any input unavailable
  strategies_using:
    - "ASA-QS-CC-01-CBOE-BXM"
    - "ASA-QS-CC-02-CBOE-BXMD"
    - "ASA-QS-CC-A1-CBOE-BXY"
  current_ASA_status: NEW_REQUIRES_X01 and option trade prints (not in taxonomy, see capability-map)
  source_ids:
    - "CBOE-BUYWRITE-METHODOLOGY-2024"

- fact_id: DF-CBOE-NAKED-MARGIN
  formula_version: 1.0.0
  formula: >-
    CBOE initial margin for a short uncovered equity option as quoted by Zhan et al.: calls
    M = C + max(0.20·S - OTM_amount, 0.10·S); puts M = P + max(0.20·S - OTM_amount, 0.10·K),
    OTM_amount = max(0, K - S) for calls and max(0, S - K) for puts (per contract unit).
  inputs:
    - "option price"
    - "S"
    - "K"
  units: USD per option unit
  time_semantics: formation
  missing_behavior: UNKNOWN if inputs missing
  strategies_using:
    - "ASA-QS-XR-01-ZHAN-NEG-LNPRICE-DN-CALL"
  current_ASA_status: NEW (A15 generalized margin)
  source_ids:
    - "ZHAN-ET-AL-2022"

- fact_id: DF-HESTON-SPAN-MARGIN
  formula_version: 1.0.0
  formula: >-
    SPAN-style margin: the worst loss of the position across a scenario grid of underlying price moves
    of ±15% in 3% increments crossed with implied volatility moves of ±10%, revaluing with
    Black-Scholes. Scenario-grid details beyond this (e.g. extreme-move weighting, volatility
    shift units) not recovered: UNKNOWN.
  inputs:
    - "position legs"
    - "S"
    - "IVs"
    - "r"
  units: USD
  time_semantics: formation
  missing_behavior: UNKNOWN
  strategies_using:
    - "ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM"
  current_ASA_status: NEW (A15)
  source_ids:
    - "HESTON-ET-AL-2023"

