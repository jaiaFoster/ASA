# ASA-RES-STRATEGY-QUALIFICATION-002 — deduplicated derived-fact registry (ROLE-RESEARCH).
#
# Every mathematical transformation that any primary or alternate specification in
# strategy-specifications/ consumes is defined once here. A specification refers to a
# fact by fact_id and never restates its formula.
#
# These are research definitions only. They are not analytics implementations. A formula
# marked source-faithful is quoted or transcribed from the cited source. Where the source
# leaves a component undefined, the component is written as UNKNOWN and is not filled in.
#
# current_ASA_status values (read against main @ 63f824c):
#   EXISTING         a registered analytics feature already computes this definition
#   EXISTING_PARTIAL a registered feature is related but not definitionally identical
#   NEW              no registered feature; pure calculation over canonical facts
#   NEW_REQUIRES_<X> as NEW, but an input depends on capability/primitive <X>
#
# Units: USD prices are per option contract unit (per share of underlying), not per
# 100-multiplier contract, unless stated. Rates are decimals (0.05 = 5%).
schema: asa.research.derived_fact_registry/v1
sprint: ASA-RES-STRATEGY-QUALIFICATION-002
recorded_at: '2026-09-27'
conventions:
  option_price_inputs: bid(c,t), ask(c,t) are canonical OptionContract.bid / .ask at observation t.
  asa_mark_warning: >-
    ASA OptionContract.mark is populated from the Tradier "last" field (market_data/tradier.py
    _option), i.e. a last trade price, not the bid/ask midpoint. No specification in this
    sprint may use OptionContract.mark where a source uses the quote midpoint; DF-OPT-MID is
    required instead.
  delta_provenance_warning: >-
    ASA canonical option delta comes from the provider's greeks (Tradier; ORATS-sourced).
    Every source in this sprint used OptionMetrics deltas (binomial for American equity
    options) or a Black/Black-Scholes delta with stated or unstated inputs. Equivalence of the
    ASA delta to the source delta is UNKNOWN in every case and is recorded per specification.
facts:

# ---------------------------------------------------------------- option quote primitives
- fact_id: DF-OPT-MID
  formula_version: 1.0.0
  formula: mid(c,t) = (bid(c,t) + ask(c,t)) / 2
  inputs:
    - "bid(c,t)"
    - "ask(c,t)"
  units: USD per option unit
  time_semantics: same observation t as both quote inputs; bid and ask must come from one quote snapshot
  missing_behavior: UNKNOWN if either bid or ask is missing; INVALID if bid > ask (canonical domain already rejects bid > ask)
  strategies_using:
    - "ALL"
  current_ASA_status: NEW (no registered midpoint fact; OptionContract.mark is last trade, see conventions)
  source_ids:
    - "CBOE-PUTWRITE-METHODOLOGY-2024"
    - "CBOE-BUYWRITE-METHODOLOGY-2024"
    - "GAO-XING-ZHANG-2013-WP"
    - "ALEXIOU-ET-AL-2025"
    - "HESTON-ET-AL-2023"
    - "ZHAN-ET-AL-2022"
    - "CAO-HAN-2013"

- fact_id: DF-OPT-RELATIVE-SPREAD
  formula_version: 1.0.0
  formula: rs(c,t) = (ask(c,t) - bid(c,t)) / mid(c,t)
  inputs:
    - "bid(c,t)"
    - "ask(c,t)"
    - "DF-OPT-MID"
  units: dimensionless fraction of midpoint
  time_semantics: same snapshot as DF-OPT-MID
  missing_behavior: UNKNOWN if mid is missing; UNKNOWN if mid = 0 (division undefined)
  strategies_using:
    - "ASA-QS-EV-02-ALX-CONCAVE-EA-STRADDLE"
    - "ASA-QS-EV-01-GXZ-PREEA-STRADDLE-TO-EXPIRY"
    - "ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM"
  current_ASA_status: EXISTING_PARTIAL (a raw option-liquidity dimension is registered in analytics/derived_facts.py; semantic identity with this definition is unverified). A12 owner.
  source_ids:
    - "ALEXIOU-ET-AL-2025"
    - "GAO-XING-ZHANG-2013-WP"
    - "HESTON-ET-AL-2023"

- fact_id: DF-OPT-WEIGHTED-SPREAD
  formula_version: 1.0.0
  formula: >-
    wrs(P,t) = sum_j |q_j| * (ask(c_j,t) - bid(c_j,t)) / sum_j |q_j| * mid(c_j,t), for a
    multi-leg position P with leg weights q_j. Heston et al. state the spread condition for the
    zero-delta straddle as "the weighted average bid/ask spread ... expressed as a percentage of
    bid-ask midpoints"; the exact aggregation (value weights vs contract weights) is UNKNOWN.
  inputs:
    - "bid"
    - "ask"
    - "DF-OPT-MID"
    - "leg weights"
  units: dimensionless
  time_semantics: formation snapshot
  missing_behavior: UNKNOWN if any leg quote missing; the aggregation rule itself is UNKNOWN (see formula)
  strategies_using:
    - "ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM"
  current_ASA_status: NEW (A12 extension)
  source_ids:
    - "HESTON-ET-AL-2023"

- fact_id: DF-OPT-EFFECTIVE-PRICE
  formula_version: 1.0.0
  formula: >-
    buy_price(c,t,k) = mid(c,t) + k * (ask(c,t) - bid(c,t)) / 2 ;
    sell_price(c,t,k) = mid(c,t) - k * (ask(c,t) - bid(c,t)) / 2 ;
    k = effective spread / quoted spread (k = 0 midpoint, k = 1 full quoted spread: buy at ask, sell at bid)
  inputs:
    - "bid"
    - "ask"
    - "DF-OPT-MID"
    - "k"
  units: USD per option unit
  time_semantics: transaction snapshot
  missing_behavior: UNKNOWN if bid or ask missing
  strategies_using:
    - "ASA-QS-EV-01-GXZ-PREEA-STRADDLE-TO-EXPIRY"
    - "ASA-QS-EV-A1-GXZ-DN-STRADDLE-M3-0"
    - "ASA-QS-EV-02-ALX-CONCAVE-EA-STRADDLE"
    - "ASA-QS-XR-01-ZHAN-NEG-LNPRICE-DN-CALL"
    - "ASA-QS-XR-A1-CAOHAN-IVOL-DH-CALL"
  current_ASA_status: NEW (cost-model fact for outcome interpretation; k is an evaluation parameter, never a signal input)
  source_ids:
    - "GAO-XING-ZHANG-2013-WP (footnote 16 worked example bid 3 / ask 4 / k 0.5 -> buy 3.75, sell 3.25)"
    - "ZHAN-ET-AL-2022"
    - "CAO-HAN-2013"
    - "ALEXIOU-ET-AL-2025"

