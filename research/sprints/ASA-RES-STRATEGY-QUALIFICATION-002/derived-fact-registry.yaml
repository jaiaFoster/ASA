# ---------------------------------------------------------------- option-return facts
- fact_id: DF-OPT-HOLDING-RETURN
  formula_version: 1.0.0
  formula: >-
    R(c; t0,t1) = V(c,t1) / V(c,t0) - 1, where V(c,t0) is the entry price and V(c,t1) is the exit
    price. At expiration V = intrinsic value: call max(0, S_T - K), put max(0, K - S_T), with S_T
    the source-defined settlement value. Price convention (mid, ask, bid, DF-OPT-EFFECTIVE-PRICE)
    is a per-specification parameter.
  inputs:
    - "entry price"
    - "exit price or settlement S_T"
  units: simple return (decimal)
  time_semantics: t0 entry snapshot, t1 exit snapshot or expiration settlement
  missing_behavior: UNKNOWN if either price missing; UNKNOWN if V(c,t0) <= 0
  strategies_using:
    - "ASA-QS-EV-01-GXZ-PREEA-STRADDLE-TO-EXPIRY"
    - "ASA-QS-EV-A1-GXZ-DN-STRADDLE-M3-0"
    - "ASA-QS-EV-02-ALX-CONCAVE-EA-STRADDLE"
    - "ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM"
  current_ASA_status: NEW (outcome/tracking fact; A17 option-return history consumes it)
  source_ids:
    - "GAO-XING-ZHANG-2013-WP"
    - "ALEXIOU-ET-AL-2025"
    - "HESTON-ET-AL-2023"

- fact_id: DF-STRADDLE-ZERO-DELTA-WEIGHT
  formula_version: 1.0.0
  formula: >-
    Return weight on the call leg of a zero-delta call+put pair (same underlying, strike and
    expiration): w_c = -(Δp/P) / (Δc/C - Δp/P) = -Δp·C / (Δc·P - Δp·C); w_p = 1 - w_c =
    Δc·P / (Δc·P - Δp·C). Here C, P are formation prices and Δc > 0, Δp < 0 are formation
    deltas. The two forms are algebraically identical (multiply numerator and denominator by
    C·P). ALX eq. (5) states the first form; Heston et al. state weights proportional to
    (-Δp·C, Δc·P) normalized to sum to one, which is the second form. Implied contract
    quantities per unit capital: n_c = w_c / C, n_p = w_p / P, which satisfy n_c·Δc + n_p·Δp = 0.
  inputs:
    - "C"
    - "P (formation price per the spec's convention)"
    - "Δc"
    - "Δp (formation deltas)"
  units: dimensionless weights summing to 1
  time_semantics: fixed at formation; not rebalanced
  missing_behavior: UNKNOWN if any input missing; INVALID if Δc <= 0 or Δp >= 0 (denominator sign not guaranteed)
  strategies_using:
    - "ASA-QS-EV-02-ALX-CONCAVE-EA-STRADDLE"
    - "ASA-QS-EV-A1-GXZ-DN-STRADDLE-M3-0"
    - "ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM"
    - "ASA-QS-EV-01-GXZ-PREEA-STRADDLE-TO-EXPIRY (conditional, see that spec)"
  current_ASA_status: NEW_REQUIRES_P03 (P03 straddle with non-unit leg ratios)
  source_ids:
    - "ALEXIOU-ET-AL-2025"
    - "HESTON-ET-AL-2023"
    - "GAO-XING-ZHANG-2013-WP (\"weights adjusted to make straddle delta zero\"; formula not printed — DERIVED equivalence)"

- fact_id: DF-STRADDLE-RETURN
  formula_version: 1.0.0
  formula: R_straddle = w_c · R(call; t0,t1) + w_p · R(put; t0,t1), with DF-OPT-HOLDING-RETURN legs and weights either DF-STRADDLE-ZERO-DELTA-WEIGHT or (for a simple straddle) value weights C/(C+P), P/(C+P)
  inputs:
    - "DF-OPT-HOLDING-RETURN (call and put)"
    - "weights"
  units: simple return
  time_semantics: formation to exit
  missing_behavior: UNKNOWN if either leg return is UNKNOWN
  strategies_using:
    - "ASA-QS-EV-01-GXZ-PREEA-STRADDLE-TO-EXPIRY"
    - "ASA-QS-EV-A1-GXZ-DN-STRADDLE-M3-0"
    - "ASA-QS-EV-02-ALX-CONCAVE-EA-STRADDLE"
    - "ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM"
  current_ASA_status: NEW_REQUIRES_P03
  source_ids:
    - "ALEXIOU-ET-AL-2025"
    - "HESTON-ET-AL-2023"
    - "GAO-XING-ZHANG-2013-WP"

- fact_id: DF-DN-CALL-WRITE-RETURN
  formula_version: 1.0.0
  formula: >-
    Buy-and-hold return to writing one call hedged with Δ_t shares, no rebalancing (Zhan et al.
    eq. 1): H_t = Δ_t·S_t - C_t (> 0), HR = (Δ_t·S_{t+1} - C_{t+1}) / (Δ_t·S_t - C_t) - 1.
    Margin-adjusted form (eq. 2): HR_m = [(Δ_t·S_{t+1} - C_{t+1}) - (r/12)·M] / (Δ_t·S_t - C_t) - 1,
    r = option-maturity-matched annual LIBOR, M = CBOE initial naked-call margin (DF-CBOE-NAKED-MARGIN).
    The long-short strategy return is defined by the source only as the difference between the decile-10
    and decile-1 portfolio average HRs; the capital convention of the bought (long delta-hedged call) leg is not stated (UNKNOWN).
  inputs:
    - "Δ_t (Black-Scholes call delta at t)"
    - "S_t"
    - "S_{t+1}"
    - "C_t"
    - "C_{t+1}"
    - "r"
    - "M"
  units: simple monthly return
  time_semantics: t = formation month end; t+1 = next month end
  missing_behavior: UNKNOWN if any input missing; UNKNOWN if H_t <= 0
  strategies_using:
    - "ASA-QS-XR-01-ZHAN-NEG-LNPRICE-DN-CALL"
  current_ASA_status: NEW_REQUIRES_P10 (P10 delta-hedged option)
  source_ids:
    - "ZHAN-ET-AL-2022"

- fact_id: DF-DH-CALL-DAILY-REBAL-RETURN
  formula_version: 1.0.0
  formula: >-
    Cao-Han: short one call against Δ shares, Δ = Black-Scholes call delta re-set each trading day;
    daily return over [t, t+1] = H_{t+1}/H_t - 1 with H_t = Δ_t·S_t - C_t; monthly return =
    Π_d (1 + daily return_d) - 1 over the trading days to the next month end.
  inputs:
    - "daily Δ_t"
    - "S_t"
    - "C_t"
  units: simple monthly return
  time_semantics: daily closes from formation month end to next month end
  missing_behavior: UNKNOWN if any daily input missing (source does not state a fill rule)
  strategies_using:
    - "ASA-QS-XR-A1-CAOHAN-IVOL-DH-CALL"
  current_ASA_status: NEW_REQUIRES_A14
  source_ids:
    - "CAO-HAN-2013"

- fact_id: DF-BK-DELTA-HEDGED-GAIN
  formula_version: 1.0.0
  formula: >-
    Bakshi-Kapadia (2003) discrete delta-hedged gain for a long call held to expiry T, hedged at
    N rebalancing dates t_n: π_{t,t+τ} = max(S_T - K, 0) - C_t - Σ_{n=0}^{N-1} Δ_{t_n}·(S_{t_{n+1}} - S_{t_n})
    - Σ_{n=0}^{N-1} r_n·(C_t - Δ_{t_n}·S_{t_n})·τ/N. Δ_{t_n} is the Black-Scholes delta evaluated with
    a volatility estimate whose definition is a source choice (GARCH fitted on the full sample, or
    historical volatility); dividends enter as the present value of actual dividends subtracted from S.
  inputs:
    - "S path"
    - "K"
    - "C_t"
    - "daily Δ"
    - "r_n"
    - "τ"
  units: index points (source normalizes by index level for comparison)
  time_semantics: daily from entry to expiry
  missing_behavior: UNKNOWN if any rebalancing input missing
  strategies_using:
    - "ASA-QS-SV-A1-BK-DELTA-HEDGED-INDEX-CALL"
  current_ASA_status: NEW_REQUIRES_A14
  source_ids:
    - "BAKSHI-KAPADIA-2003"

# ---------------------------------------------------------------- volatility facts
- fact_id: DF-CW-SYNTHETIC-VARIANCE-SWAP-RATE-30D
  formula_version: 1.0.0
  formula: >-
    Carr-Wu (2009) eq. (49)-(50): at each of the two nearest maturities T no shorter than 8 calendar
    days, SW_t(T) = E^Q[RV_{t,T}] = (2/(T-t)) · [ ∫_{-inf}^{0} ( N(-d2(k)) - e^{-k}·N(-d1(k)) ) dk
    + ∫_{0}^{inf} ( e^{-k}·N(d1(k)) - N(d2(k)) ) dk ], k = ln(K/F_t),
    d1(k) = (-k + IV(k)²(T-t)/2) / (IV(k)·sqrt(T-t)), d2(k) = d1(k) - IV(k)·sqrt(T-t).
    IV(k) is linearly interpolated in k between observed IVs and held flat beyond the lowest/highest
    strike, on a grid of 2,000 points over ±8 standard deviations (standard deviation approximated by
    the average IV). Options kept only if bid > 0 and bid < ask. SW at 30 calendar days = linear
    interpolation in maturity between the two maturities, no extrapolation; if the shortest maturity
    exceeds 30 days, the shortest maturity's SW is used. F_t is computed from interest rates, dividend
    yields and spot. Transcription note: the extracted PDF text of eq. (49) is garbled in the
    integrand signs; the form above is the one consistent with the source's own Black (1976)
    prices in eq. (47) normalized by K·B_t(T) (DERIVED).
  inputs:
    - "option IVs for two maturities"
    - "F_t (requires r and dividend yield)"
    - "B_t(T)"
  units: annualized variance
  time_semantics: daily observation; 30-calendar-day constant maturity
  missing_behavior: UNKNOWN if no maturity >= 8 days exists or if F_t inputs are unavailable
  strategies_using:
    - "none as signal — registered as the lane-3 variance-replication measurement"
    - "see LANE-03"
  current_ASA_status: NEW_REQUIRES_A07 (and X04 for rates / forward)
  source_ids:
    - "CARR-WU-2009"

- fact_id: DF-CW-REALIZED-VARIANCE-30D
  formula_version: 1.0.0
  formula: RV_{t,t+30} = (365/30) · Σ_{i=1}^{N} ((F_i - F_{i-1}) / F_{i-1})², summing daily forward-price returns over the 30 calendar days following t (CW eq. 51; F = forward/futures level)
  inputs:
    - "daily forward or futures prices"
  units: annualized variance
  time_semantics: forward-looking realized over [t, t+30 calendar days]
  missing_behavior: UNKNOWN if the window is incomplete
  strategies_using:
    - "none as signal — LANE-03 measurement"
  current_ASA_status: EXISTING_PARTIAL (analytics realized_volatility is population volatility of daily log returns; not this estimator)
  source_ids:
    - "CARR-WU-2009"

- fact_id: DF-ALX-BLENDED-IV-POINTS
  formula_version: 1.0.0
  formula: >-
    For one expiry: for strikes with |K/S - 1| <= 0.02, IV(K) = w·IV_P(K) + (1 - w)·IV_C(K),
    w = (K_high - K)/(K_high - K_low), K_high / K_low = highest / lowest strike inside the ±2% band;
    outside the band use the OTM option's IV (puts below, calls above). Require >= 6 points with
    >= 2 puts and >= 2 calls after blending.
  inputs:
    - "per-strike put and call IVs (OptionMetrics in source)"
    - "S"
  units: annualized IV (decimal)
  time_semantics: close of trading day d-1 before the EAD
  missing_behavior: UNKNOWN when the point-count requirement fails
  strategies_using:
    - "ASA-QS-EV-02-ALX-CONCAVE-EA-STRADDLE"
  current_ASA_status: NEW
  source_ids:
    - "ALEXIOU-ET-AL-2025"

- fact_id: DF-ALX-CONCAVE
  formula_version: 1.0.0
  formula: >-
    (1) Fit a quintic smoothing spline IV^(x), x = K/S, to DF-ALX-BLENDED-IV-POINTS by minimizing
    ρ·Σ_i [IV(K_i) - IV^(K_i)]² + ∫ S'''(x)² dx (MATLAB spaps; ρ chosen so the sum of squared errors
    stays within the tolerance). Start at a tolerance equal to 0.01% RMSE between actual and fitted IVs.
    (2) Evaluate the curve at 1,001 points, convert to call prices with Black-Scholes, and compute the
    risk-neutral density f(K) = e^{rT}·∂²C/∂K² by finite differences over the available moneyness range.
    (3) If any fitted IV is negative, any density point is negative, or the density has more than two
    modes, raise the RMSE bound in steps of 0.005% and refit until all three conditions hold.
    (4) CONCAVE = 1 iff all hold: (a) IV^''(x) < 0 over a continuous moneyness range of at least 0.03;
    (b) the curve has a stationary point inside that concave range; (c) the stationary point lies
    between the second-lowest (K_min+1) and second-highest (K_max-1) strikes of the actual IV points
    (whether "between" is strict is not stated: UNKNOWN at equality). Otherwise CONCAVE = 0.
  inputs:
  - "DF-ALX-BLENDED-IV-POINTS"
  - "risk-free rate r"
  - "S"
  - "time to expiry T"
  units: indicator {0,1}
  time_semantics: close of the trading day before the EAD (d-1)
  missing_behavior: "UNKNOWN if the fit never satisfies the admissibility conditions (no cap on tolerance steps is stated: UNKNOWN); UNKNOWN if r unavailable"
  strategies_using:
  - "ASA-QS-EV-02-ALX-CONCAVE-EA-STRADDLE"
  current_ASA_status: NEW_REQUIRES_X04 (r for the density admissibility test)
  source_ids:
  - "ALEXIOU-ET-AL-2025 (§2.1 fit and density; §2.2 definition)"

- fact_id: DF-BLACK-CALL-DELTA-CBOE-BXMD
  formula_version: 1.0.0
  formula: >-
    Δ_call = Black-formula call delta for an SPX call "using the Black formula" with "all inputs ...
