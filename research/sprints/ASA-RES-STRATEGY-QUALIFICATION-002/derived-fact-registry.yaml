  units: dimensionless
  time_semantics: last values before 11:00 ET on the roll date
  missing_behavior: UNKNOWN (formula inputs undefined by source)
  strategies_using:
    - "ASA-QS-CC-02-CBOE-BXMD"
  current_ASA_status: NEW (blocked on source definition)
  source_ids:
    - "CBOE-BUYWRITE-METHODOLOGY-2024"
    - "CBOE-BXRT-METHODOLOGY"

# ---------------------------------------------------------------- cross-sectional facts
- fact_id: DF-NEG-LN-PRICE
  formula_version: 1.0.0
  formula: x_i,t = -ln(P_i,t), P_i,t = closing stock price of i on the formation month-end trading day t
  inputs:
    - "daily close P_i"
    - "t"
  units: log USD (sign-inverted)
  time_semantics: >-
    Formation at the close of the last trading day of month t. Zhan et al. describe Ln(PRICE) as
    "the log of stock price at the end of last month" from the perspective of the holding month,
    i.e. the formation month-end (DERIVED). At formation the observed close is the same whether or
    not the series is later split-adjusted, so no adjustment choice arises in live use.
  missing_behavior: UNKNOWN if the formation-day close is missing
  strategies_using:
    - "ASA-QS-XR-01-ZHAN-NEG-LNPRICE-DN-CALL"
  current_ASA_status: EXISTING_PARTIAL (latest_price v1 exists; the log transform is NEW)
  source_ids:
    - "ZHAN-ET-AL-2022"

- fact_id: DF-STRADDLE-MOMENTUM-FORMATION
  formula_version: 1.0.0
  formula: >-
    MOM_i,t = (1/11) · Σ_{l=2}^{12} R_straddle,i,t-l, the simple average of the stock's monthly
    zero-delta straddle returns (DF-STRADDLE-RETURN held expiration-to-expiration) over lags 2..12.
    Heston et al. require the formation period to have NO missing observations for straddles
    ("relax the requirement used elsewhere that the formation period have no missing
    observations" is stated only for VIX-portfolio returns, which instead need 2/3 of months).
  inputs:
    - "11 monthly DF-STRADDLE-RETURN values"
  units: simple monthly return
  time_semantics: formed on each monthly expiration day; lag 1 = the month just ended, skipped
  missing_behavior: UNKNOWN (stock ineligible) if any of lags 2..12 is missing
  strategies_using:
    - "ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM"
  current_ASA_status: NEW_REQUIRES_A08 (historical option-price panel) and A17 (option-return history)
  source_ids:
    - "HESTON-ET-AL-2023"

- fact_id: DF-XS-QUANTILE-ASSIGNMENT
  formula_version: 1.0.0
  formula: >-
    q_i,t = quantile group of x_i,t among the eligible set U_t sorted by x, with Q groups (Q = 10
    deciles or Q = 5 quintiles per source). Sources state "sort into deciles/quintiles" with equal
    weighting of membership by rank; none of the sources in this sprint states (a) breakpoint
    convention when |U_t| is not divisible by Q, (b) tie handling, or (c) whether NYSE-only
    breakpoints are used. Those three components are UNKNOWN; winsorization at 0.5%/99.5% is applied
    by Zhan et al. to regression variables only, not stated for sorts (UNKNOWN for sorts).
  inputs:
    - "x_i"
    - "t for all i in U_t"
