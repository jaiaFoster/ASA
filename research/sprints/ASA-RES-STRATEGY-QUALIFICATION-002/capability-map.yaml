# ASA-RES-STRATEGY-QUALIFICATION-002 — capability map (ROLE-RESEARCH).
schema: asa.research.capability_map/v1
sprint: ASA-RES-STRATEGY-QUALIFICATION-002
recorded_at: '2026-09-27'
note: 'Closeout revision (2026-09-27): X02a meaning restored; X05/X06/X07 and security-master facts per PR #501
  Architect review. Maps each candidate to existing ASA capabilities and to missing reusable primitives named in
  the existing taxonomy (P/A/X) as classified in ASA-STRATEGY-CAPABILITY-SELECTION-001. Gaps outside the taxonomy
  are listed separately and flagged for Architect classification. This file proposes no implementation.'
existing_asa_capabilities:
  REAL_TIME_QUOTE_V1: market capability (existing)
  HISTORICAL_BARS_V1: market capability (existing)
  OPTION_CHAIN_V1: market capability (existing; Tradier/ORATS greeks; mark = last trade)
  EARNINGS_CALENDAR_V1: market capability (existing; Finnhub, Alpha Vantage)
  TRADING_CALENDAR_V1: market capability (existing)
  CORPORATE_ACTIONS_V1: market capability (existing)
  days_to_expiration: analytics fact 1.0.0 (existing)
  option_implied_volatility: analytics fact 1.0.0 (existing)
  cross_sectional_ranking: analytics/cross_sectional_ranking.py rank_named_facts (existing, partial for quantiles)
  vertical_structure / calendar_structure: asa.stonk.options components (existing; not used by any candidate)
  verdict_classifier: asa.stonk.shared (existing)
taxonomy_primitives_referenced:
  P01:
    name: single option leg
    architect_support: CONTRACT_CHANGE B3
  P03:
    name: straddle (incl. non-unit zero-delta ratios)
    architect_support: CONTRACT_CHANGE B3
  P09:
    name: stock/index + option overlay
    architect_support: CONTRACT_CHANGE B3
  P10:
    name: delta-hedged option
    architect_support: CONTRACT_CHANGE B4 standalone (B3 in XR bundle)
  P12:
    name: cross-sectional portfolio
    architect_support: per selection report, XR bundle B3
  X01:
    name: index-option identity/root/settlement (AM/PM, SOQ)
    architect_support: CONTRACT_CHANGE B4, identity-bearing
  X02a:
    name: live intraday index-option chain acquisition after X01 (Architect definition; restored at closeout)
    architect_support: EXTENSION B1 after X01
    used_by_selected: 'none: no selected strategy requires repeated or intraday option-chain acquisition'
  X05:
    name: 'OPTION_TRADE_TAPE: canonical option trade events (identity, price, size, event timestamp, sale-condition/eligibility
      metadata) sufficient to reproduce source-defined VWAPs'
    role: DATA
    architect_support: CONTRACT_CHANGE
    burden: B3_CROSS_CUTTING
    protected_impact: ADDITIVE_PUBLIC
    confidence: HIGH
    note: not equivalent to OptionContract.mark or bid/ask midpoint
  X06:
    name: 'QUOTE_EVENT_CAPTURE: event-time quote history sufficient to identify the first valid quote after a timestamp
      (not scheduler polling)'
    role: DATA
    architect_support: CONTRACT_CHANGE
    burden: B3_CROSS_CUTTING
    protected_impact: ADDITIVE_PUBLIC
    confidence: MEDIUM
  X07:
    name: 'INDEX_DIVIDEND_POINTS: S&P 500 ex-dividend amounts in index points'
    role: DATA
    architect_support: CONTRACT_CHANGE
    burden: B3_CROSS_CUTTING
    protected_impact: ADDITIVE_PUBLIC
    confidence: HIGH
    note: CORPORATE_ACTIONS_V1 for securities is not a faithful substitute
  INDEX_QUOTE:
    name: canonical INDEX quote (SPX value last disseminated before a timestamp; closes) enabled by X01 plus the
      provider-neutral quote path extended to INDEX subjects
    architect_support: 'part of X01 enabling work (PR #501 Architect review item 1)'
  X04:
    name: rate/discount data (T-bill, LIBOR, r)
    architect_support: B3, conditional
  A06:
    name: skew history
    architect_support: EXTENSION B1
  A07:
    name: model-free risk-neutral moments
    architect_support: NEW_CAPABILITY B2
  A08:
    name: historical option-price panel
    architect_support: CONTRACT_CHANGE B3
  A10:
    name: borrow fee
    architect_support: CONTRACT_CHANGE B3
  A12:
    name: liquidity / effective-spread measurement
    architect_support: EXTENSION B1
  A14:
    name: dynamic delta-hedge simulation
    architect_support: NEW_CAPABILITY B3
  A15:
    name: generalized margin/capital model
    architect_support: NEW_CAPABILITY B3
  A17:
    name: option-return history
    architect_support: HARD dependency on A08
gaps_outside_taxonomy_as_flagged_in_pr501:
  GAP-OPTION-TRADE-PRINTS: OPRA option trade prints with sale-condition codes, needed for Cboe VWAP entry prices
    (PUT, PUTY, BXM, BXMD, BXY). Not in the P/A/X taxonomy. Affects outcome valuation, not proposal selection. REQUIRES
    ARCHITECT REVIEW (classification only).
  GAP-QUOTE-EVENT-CAPTURE: first quote event after a timestamp (WPUT "first bid after 9:30 a.m. ET"). Not in taxonomy.
    REQUIRES ARCHITECT REVIEW.
  GAP-SECURITY-TYPE: common-stock identification (CRSP share code 10/11 equivalent). Canonical fact absent.
  GAP-SHARES-OUTSTANDING: market capitalization inputs for value weights. Canonical fact absent.
  GAP-INDEX-DIVIDEND-POINTS: S&P 500 ex-dividend amounts in index points (BXM return accounting). Canonical fact
    absent.
  GAP-EXTERNAL-FACTOR-DATA: Fama-French daily factors (Cao-Han IVOL). Not a market capability.
gap_reclassification_pr501_architect:
  GAP-OPTION-TRADE-PRINTS: X05 OPTION_TRADE_TAPE
  GAP-QUOTE-EVENT-CAPTURE: X06 QUOTE_EVENT_CAPTURE
  GAP-INDEX-DIVIDEND-POINTS: X07 INDEX_DIVIDEND_POINTS
  GAP-SECURITY-TYPE: security_master.security_type (canonical fundamental/security-master fact via market_data;
    not a strategy primitive)
  GAP-SHARES-OUTSTANDING: security_master.shares_outstanding (same)
  GAP-EXTERNAL-FACTOR-DATA: research/analytic input only; no production MarketCapability unless a live rule consumes
    the factor (no selected strategy does)
bxm_p09_architecture_status: 'ARCHITECT_REVIEW_REQUIRED: do not represent the S&P 500 index as a tradable stock
  and do not substitute SPY or futures; resolve P09 as generic underlying-exposure + option overlay or another faithful
  generic representation'
