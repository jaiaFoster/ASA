lanes:
  1-event-volatility:
    primaries_specified: 2
    alternates: 1
    selected:
    - ASA-QS-EV-01-GXZ-PREEA-STRADDLE-TO-EXPIRY
    pr501_reason: 'No event-volatility rule reached READY: GXZ hold-to-expiry has unresolved DTE, leg-ratio and
      multi-pair semantics in the only accessible version; ALX has no live universe and no source-authored trade
      direction. The headline GXZ [-3,0] round trip is rejected on the authors'' own cost calculation.'
  2-index-put-writing:
    primaries_specified: 2
    alternates: 1
    selected:
    - ASA-QS-PW-01-CBOE-PUT
    - ASA-QS-PW-A1-CBOE-PUTY
    pr501_reason: 'PUT is fully specified (READY_WITH_EXPLICIT_UNKNOWNS: provider questions only). WPUT has an AM-roll
      timing inconsistency in the methodology. PUTY is complete but has no recovered performance evidence.'
  3-index-short-volatility:
    primaries_specified: 0
    alternates: 1
    selected:
    - ASA-QS-SV-01-SCS-SHORT-NEAR-ATM-STRADDLE
    pr501_reason: No recovered source defines a tradable index short-volatility rule (entry schedule, sizing, exit)
      with evidence. Bakshi-Kapadia and Carr-Wu are measurement designs; Cboe iron condor / butterfly indexes require
      P05 (not in the advanced bundle) and were not deep-researched. 0DTE excluded by assignment.
  4-covered-call:
    primaries_specified: 2
    alternates: 1
    selected:
    - ASA-QS-CC-01-CBOE-BXM
    pr501_reason: BXM is fully specified. BXMD strike selection depends on undefined Black-formula inputs; the BXM/BXMD
      pair is at the boundary of the diversity rule (distinct only in market-regime exposure). BXY lacks evidence.
  5-option-implied-information:
    primaries_specified: 0
    alternates: 1
    selected: []
    pr501_reason: The strongest full-text evidence (Muravyev-Pearson-Pollet) shows skew, IV-spread and O/S stock-return
      predictability is insignificant net of borrow fees, concentrated in hard-to-borrow stocks. No second signal
      family with net-positive evidence was recovered (risk-neutral-moment signals not recovered in full text).
  6-cross-sectional-option-returns:
    primaries_specified: 2
    alternates: 1
    selected:
    - ASA-QS-XR-01-ZHAN-NEG-LNPRICE-DN-CALL
    - ASA-QS-XR-02-HESTON-STRADDLE-MOMENTUM
    pr501_reason: Zhan -Ln(PRICE) has the strongest net evidence in the sprint but an ex-post dividend filter, missing
      weighting inputs and an unspecified long-book capital convention. Option momentum is gross-strong but net-insignificant
      at non-algorithmic costs, with undefined replacement ordering and an A08 dependency.
