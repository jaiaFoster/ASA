# ASA-RES-STRATEGY-QUALIFICATION-002 — gate registry (ROLE-RESEARCH). One entry per source-defined gate.
# Generated from the specifications in strategy-specifications/; thresholds are quoted from the sources named in source_ids.
schema: asa.research.gate_registry/v1
sprint: ASA-RES-STRATEGY-QUALIFICATION-002
recorded_at: '2026-09-27'
semantics:
  PASS: predicate evaluated true on complete, fresh, source-admissible inputs
  FAIL: predicate evaluated false on complete inputs
  UNKNOWN: predicate cannot be evaluated faithfully (missing, stale or source-undefined input). UNKNOWN is never
    coerced to PASS or FAIL.
  AMBIGUOUS_SELECTION: a structure-selection argmin/argmax has more than one solution and the source gives no tie
    rule; treated as UNKNOWN at verdict level
  RESEARCH_BLOCKER: the source rule itself is internally inconsistent or not live-implementable; the gate is UNKNOWN
    until research resolves it
gates:
