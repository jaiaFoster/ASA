    final_strategy_id: index_short_vol_scs_near_atm_straddle
    research_spec: ASA-QS-SV-01-SCS-SHORT-NEAR-ATM-STRADDLE
    strategy_name: Santa-Clara-Saretto monthly short near-maturity ATM S&P 500 straddle
    lane: 3-index-short-volatility
    primary_sources:
    - SANTACLARA-SARETTO-2009
    source_methodology_version: Journal of Financial Markets 12(3) 2009; working-paper full text (UCLA Anderson
      copy)
    evidence_direction: MIXED/QUALIFIED (bid-to-ask 10.3%/month, monthly Sharpe 0.351; levered margin-call portfolio
      results weak)
    evidence_strength: MODERATE
    evidence_confidence: LOW-MEDIUM
    universe: SPX standard monthly options (RA-SV-01) observable at the close of the first trading day of each month;
      underlying S&P 500 index
    canonical_facts: &id020
    - spx close (INDEX quote)
    - SPX chain bid/ask/IV/strike/expiration/settlement (X01)
    - risk-free rate and dividend yield (X04)
    - SOQ if expiry precedes exit (X01)
    - exchange calendar
    derived_facts: &id021
    - DF-FIRST-TRADING-DAY-OF-MONTH
    - DF-OPT-DTE-CALENDAR
    - DF-OPT-MID
    - DF-ZERO-COST-OPTION-RETURN
    - DF-CBOE-NAKED-MARGIN
    strategy_parameters: &id015
      target_dte_calendar_days: 45
      moneyness: ATM (strike closest to index close)
      iv_bounds:
      - '0.01'
      - '1.00'
      min_tick:
        price_below_3: '0.05'
        otherwise: '0.10'
      margin_alpha: '0.15'
      margin_beta: '0.10'
    gates:
    - gate_id: G-SCS-ENTRY-DATE
      predicate: date(t) == DF-FIRST-TRADING-DAY-OF-MONTH(month(t))
      operator: ==
      threshold: first trading day
      units: date
      boundary: n/a
      unknown_behavior: calendar unavailable
      reason_codes: &id016
        FAIL: G_SCS_ENTRY_DATE_FAIL
        UNKNOWN: G_SCS_ENTRY_DATE_UNKNOWN
    - gate_id: G-SCS-EXPIRY-UNIQUE
      predicate: argmin_T |DTE_cal(T,t) - 45| over standard monthly SPX expirations is unique
      operator: argmin
      threshold: 45 calendar days
      units: calendar days
      boundary: n/a
      unknown_behavior: two expirations equidistant from 45 days -> AMBIGUOUS_SELECTION; chain or X01 missing
      reason_codes: &id017
        FAIL: G_SCS_EXPIRY_UNIQUE_FAIL
        UNKNOWN: G_SCS_EXPIRY_UNIQUE_UNKNOWN
    - gate_id: G-SCS-STRIKE-UNIQUE
      predicate: argmin_K |K - S_close(t)| over strikes with both a call and a put at T* is unique
      operator: argmin
      threshold: S_close
      units: index points
      boundary: n/a
      unknown_behavior: two strikes equidistant from S_close -> AMBIGUOUS_SELECTION
      reason_codes: &id018
        FAIL: G_SCS_STRIKE_UNIQUE_FAIL
        UNKNOWN: G_SCS_STRIKE_UNIQUE_UNKNOWN
    - gate_id: G-SCS-QUOTE-FILTERS
      predicate: 'per leg: bid > 0 AND ask >= bid AND (ask - bid) >= tick(price) AND arbitrage bound AND 0.01 <=
        IV <= 1.00; tick = 0.05 if price < 3 else 0.10; call bound S*exp(-tau*d) - K*exp(-tau*r) < C < S*exp(-tau*d),
        put bound by parity (DERIVED)'
      operator: as stated
      threshold: as stated
      units: USD per option unit; IV decimal
      boundary: IV inclusive (excluded if "bigger than 100% or lower than 1%"); arbitrage bound open interval as
        printed
      unknown_behavior: any input missing
      reason_codes: &id019
        FAIL: G_SCS_QUOTE_FILTERS_FAIL
        UNKNOWN: G_SCS_QUOTE_FILTERS_UNKNOWN
    structure_primitive: P03 short straddle (unit ratio)
    leg_selection: T* = argmin_T |DTE_cal - 45| over standard monthly SPX expirations; K* = argmin_K |K - S_close|
      over strikes with both call and put at T*; short 1 call + 1 put at (K*, T*); ties -> AMBIGUOUS_SELECTION
    entry_timing: close of first trading day of month
    exit_timing: close of first trading day of next month, or expiration (SOQ settlement) if earlier
    roll_behavior: re-establish at the same close
    sizing: sell straddle premium equal to the notional (N = notional/(C+P)), proceeds at risk-free rate (zero-cost
      convention); notional as share of account = Founder capital decision (paper in-sample 7.5% weight NOT adopted)
    capital_collateral: CBOE index-option margin per short option alpha 15%, beta 10% (DF-CBOE-NAKED-MARGIN 1.1.0);
      straddle combination margin via A15
    transaction_costs: gross mid-to-mid; net sell at bid / buy at ask (about 4.9%/month spread cost); commissions
      not modelled
    lifecycle: 'monthly: sell at month start, buy back at next month start, re-sell; one position at a time; no
      targets/stops'
    verdict_truth_table:
