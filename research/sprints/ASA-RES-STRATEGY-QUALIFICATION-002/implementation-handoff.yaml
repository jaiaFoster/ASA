      component: asa.core expression_predicate / compare (three-state; threshold from parameters)
      role: gate
      gate_id: G-HES-FORMATION-DATE
      predicate: date(t) == monthly expiration date (pre-2015 Saturday expirations use the prior trading day)
      operator: ==
      units: date
      boundary: n/a
      reason_codes: *id048
    - node_id: gate_hes_call_delta_band
      component: asa.core expression_predicate / compare (three-state; threshold from parameters)
      role: gate
      gate_id: G-HES-CALL-DELTA-BAND
      predicate: 0.25 <= Δc <= 0.75
      operator: between
      units: dimensionless delta
      boundary: source says "discard if call delta < 0.25 or > 0.75" -> inclusive
      reason_codes: *id049
    - node_id: gate_hes_oi_holding
      component: asa.core expression_predicate / compare (three-state; threshold from parameters)
      role: gate
      gate_id: G-HES-OI-HOLDING
      predicate: OI(call) > 0 AND OI(put) > 0 at formation
      operator: '>'
      units: contracts
      boundary: exclusive
      reason_codes: *id050
    - node_id: gate_hes_lowcost_leg_spread
      component: asa.core expression_predicate / compare (three-state; threshold from parameters)
      role: gate
      gate_id: G-HES-LOWCOST-LEG-SPREAD
      predicate: DF-OPT-RELATIVE-SPREAD(call) <= 0.10 AND DF-OPT-RELATIVE-SPREAD(put) <= 0.10
      operator: <=
      units: fraction of midpoint
      boundary: inclusive (source avoids spreads "above 10%")
      reason_codes: *id051
    - node_id: gate_hes_formation_complete
      component: asa.core expression_predicate / compare (three-state; threshold from parameters)
      role: gate
      gate_id: G-HES-FORMATION-COMPLETE
      predicate: count_{l=2..12} defined(R_straddle,i,t-l) == 11
      operator: ==
      units: count of months
      boundary: n/a
      reason_codes: *id052
    - node_id: gates_all
      component: asa.core boolean_and (must propagate UNKNOWN per truth table; never coerce UNKNOWN)
      role: gate
    - node_id: structure
      component: asa.stonk.options straddle_structure [P03; component to be provided by the reusable primitive,
        not strategy-specific]
      role: structure
      selection: pair expiring next month with call delta closest to 0.5 and both legs OI > 0; weights ∝ (-Δp·C,
        Δc·P) at mid; no replacement (RA-XR-03); |Δc-0.5| tie -> AMBIGUOUS_SELECTION
    - node_id: portfolio
      component: cross_sectional_portfolio [P12] over asa.core rank / filter / portfolio_constraint
      role: structure
      selection: quantile assignment via DF-XS-QUANTILE-ASSIGNMENT; long/short groups and weights per parameters
    - node_id: direction
      component: asa.core constant (source-authored direction)
      role: direction
    - node_id: verdict
      component: asa.stonk.shared verdict_classifier fed by gates_all (PASS/UNKNOWN/FAIL mapping per truth table)
      role: verdict
