- frozen_specification:
    final_strategy_id: index_putwrite_cboe_puty
    research_spec: ASA-QS-PW-A1-CBOE-PUTY
    strategy_name: Cboe S&P 500 2% OTM PutWrite (PUTY)
    lane: 2-index-put-writing
    primary_sources:
    - CBOE-PUTWRITE-INDICES-METHODOLOGY-2024
    - CBOE-PUTY-FACTSHEET-2026
    source_methodology_version: Cboe PutWrite Indices Methodology, retrieved 2026-09-27
    evidence_direction: QUALIFIED (6.9% ann., vol 8.7%, MDD -28.9%, beta 0.43 vs S&P TR 11.2%/15.2%/-50.9%)
    evidence_strength: MODERATE
    evidence_confidence: LOW-MEDIUM (sponsor factsheet)
    universe: listed SPX puts with next monthly expiration on roll date (X01)
    canonical_facts: &id009
    - spx_value last before 11:00 ET (INDEX quote)
    - SPX chain (X01)
    - option trades 11:30-12:00 ET (X05)
    - SOQ (X01)
    - US Treasury 4-week bank-discount rate (X04)
    - exchange calendar
    derived_facts: &id010
    - DF-THIRD-FRIDAY-ROLL-DATE
    - DF-OPT-MID
    - DF-CBOE-TBILL-DAILY-ACCRUAL
    strategy_parameters: &id007
      moneyness_factor: '0.98'
      strike_reference_time_ET: '11:00:00'
      vwap_window_ET: 11:30:00-12:00:00
      no_trade_fallback: last bid before end of window
      tbill_tenor_days: 28
      no_accrual_on_roll_day: true
    gates:
    - gate_id: G-CBOE-MONTHLY-ROLL-DATE
      predicate: date_ET(t) == DF-THIRD-FRIDAY-ROLL-DATE(month(t))
      operator: ==
      threshold: third Friday; preceding business day if holiday
      units: date (US/Eastern exchange calendar)
      boundary: n/a
      unknown_behavior: exchange calendar unavailable for the month
      reason_codes: *id002
    - gate_id: G-CBOE-SPX-REF-BEFORE-1100
      predicate: exists S_ref = last disseminated SPX value with timestamp < 11:00:00 ET on roll date
      operator: timestamp strictly before 11:00 ET
      threshold: 11:00 a.m. ET
      units: timestamp (America/New_York)
      boundary: exclusive of 11:00:00
      unknown_behavior: no index observation before 11:00 ET on the roll date, or the observation is after 11:00
        ET (stale/late evidence)
      reason_codes: *id003
    - gate_id: G-PUTY-STRIKE-EXISTS
      predicate: 'exists c: type=PUT, next monthly expiration, K(c) < 0.98*S_ref'
      operator: < (the source says "first available strike below"; the same document says "lower than or equal to"
        for PTLT, which supports strict <; DERIVED)
      threshold: 0.98 * S_ref
      units: index points
      boundary: exclusive; if a listed strike equals 0.98*S_ref exactly the strict/inclusive reading changes the
        leg -> AMBIGUOUS_SELECTION
      unknown_behavior: chain unavailable; or a listed strike equals 0.98*S_ref exactly (AMBIGUOUS_SELECTION)
      reason_codes: &id008
        FAIL: G_PUTY_STRIKE_EXISTS_FAIL
        UNKNOWN: G_PUTY_STRIKE_EXISTS_UNKNOWN
    structure_primitive: P01 single short put
    leg_selection: 'K* = max{K(c): K(c) < 0.98*S_ref} (strict, DERIVED); a listed strike exactly equal to 0.98*S_ref
      -> AMBIGUOUS_SELECTION -> UNKNOWN'
    entry_timing: roll date; strike from S_ref before 11:00 ET; sold at VWAP 11:30-12:00 ET (last bid if no trades)
    exit_timing: hold to expiry; settle max(0, K_old - SOQ)
    roll_behavior: same day after settlement
    sizing: 'notional equal to strike K per unit invested in 4-week T-bills (fully collateralized): N = M/K per
      unit notional (DERIVED); account capital M is a Founder capital decision'
    capital_collateral: cash-secured, 4-week T-bills, no interest accrual on roll day
    transaction_costs: VWAP entry; no commissions; net UNKNOWN
    lifecycle: monthly roll; one series at a time; no targets/stops
    verdict_truth_table:
    - - ROLL=FAIL
      - '*'
      - '*'
      - NO_ACTION
    - - ROLL=UNKNOWN
      - '*'
      - '*'
      - UNKNOWN
    - - PASS
      - REF=UNKNOWN
      - '*'
      - UNKNOWN
    - - PASS
      - PASS
      - STRIKE=UNKNOWN or AMBIGUOUS
      - UNKNOWN
    - - PASS
      - PASS
      - PASS
      - PASS (write)
    required_existing_capabilities:
    - OPTION_CHAIN_V1
    - REAL_TIME_QUOTE_V1
    - TRADING_CALENDAR_V1
    - verdict_classifier
    required_missing_reusable_capabilities:
    - X01
    - INDEX_QUOTE
    - P01
    - X04
    - A15
    - X05
    architect_decisions_required:
    - as PUT (shared)
    implementation_assumptions_separated_from_sourced_rules:
    - IA-PUT-01 (shared contract rounding disclosure)
    unresolved:
      DATA:
      - X05 trade tape
      - SOQ (X01)
      - 4-week rate (X04)
      - INDEX quote
      ARCHITECTURE:
      - A15 collateral representation (shared with PUT)
      RESEARCH:
      - independent (non-sponsor) evaluation not recovered
