      - '*'
      - UNKNOWN
    - - PASS
      - PASS
      - PASS
      - FILTERS=FAIL/UNKNOWN
      - UNKNOWN
    - - PASS
      - PASS
      - PASS
      - PASS
      - PASS (sell straddle)
