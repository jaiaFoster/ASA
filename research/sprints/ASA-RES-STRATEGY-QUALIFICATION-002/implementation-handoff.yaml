# ASA-RES-STRATEGY-QUALIFICATION-002 — implementation handoff (research translation, manifest-ready financial specifications).
schema: asa.research.implementation_handoff/v1
sprint: ASA-RES-STRATEGY-QUALIFICATION-002
recorded_at: '2026-09-27'
status: RESEARCH HANDOFF ONLY. Not a production manifest and not implementation authorization (retained by the Founder).
  Node/component names are translation guidance against existing registries; new structure components come from
  reusable primitives (architecture-handoff.yaml), never strategy-specific paths.
rules:
- Every financial eligibility rule is a graph gate listed here; none may live in an adapter, planning helper, screening
  code or runtime projection.
- UNKNOWN is never coerced to PASS or FAIL.
- Research assumptions (RA-*) and implementation assumptions (IA-*) are listed separately from sourced rules.
strategies:
- frozen_specification:
    final_strategy_id: index_putwrite_cboe_put
    research_spec: ASA-QS-PW-01-CBOE-PUT
    strategy_name: Cboe S&P 500 PutWrite (PUT) collateralized monthly ATM put writing
    lane: 2-index-put-writing
    primary_sources:
    - CBOE-PUTWRITE-METHODOLOGY-2024
    - BONDARENKO-2019-CBOE
    - WILSHIRE-2019-CBOE
    - ENNISKNUPP-2008-PUT
    source_methodology_version: Cboe S&P 500 PutWrite Indices Methodology, retrieved 2026-09-27
    evidence_direction: QUALIFIED (lower volatility and drawdown than S&P 500; no post-launch risk-adjusted edge
      2006-2018)
    evidence_strength: MODERATE
    evidence_confidence: MEDIUM
    universe: U_t = listed SPX puts (standard monthly, AM-settled at SOQ; identity via X01) with the next monthly
      expiration, observable on roll date t; underlying = S&P 500 index (no SPY/futures substitution)
    canonical_facts: &id005
    - spx_value (INDEX quote, last disseminated before 11:00:00 ET on roll date; index points)
    - 'SPX option chain: strike, expiration, root/settlement style (X01)'
    - option bid/ask last before 16:00 ET (daily marks; USD per index unit)
    - option trade tape 11:30-12:00 ET excl. sale-condition codes A-H, f-t (X05)
    - SOQ on expiration date (X01)
    - US Treasury 4-week and 13-week bank-discount rates (X04)
    - Cboe Options exchange calendar
    derived_facts: &id006
    - DF-THIRD-FRIDAY-ROLL-DATE
    - DF-OPT-MID
    - DF-CBOE-TBILL-DAILY-ACCRUAL
    - DF-CBOE-PUT-CONTRACT-COUNT
    strategy_parameters: &id001
      strike_reference_time_ET: 11:00:00 (strictly before)
      vwap_window_ET: 11:30:00-12:00:00
      vwap_excluded_sale_conditions: A-H, f-t
      no_trade_fallback: last bid before 12:00:00 ET
      tbill_tenors_days:
      - 28
      - 91
      settlement: SOQ
    gates:
    - gate_id: G-CBOE-MONTHLY-ROLL-DATE
      predicate: date_ET(t) == DF-THIRD-FRIDAY-ROLL-DATE(month(t))
      operator: ==
      threshold: third Friday; preceding business day if holiday
      units: date (US/Eastern exchange calendar)
      boundary: n/a
      unknown_behavior: exchange calendar unavailable for the month
      reason_codes: &id002
        FAIL: G_CBOE_MONTHLY_ROLL_DATE_FAIL
        UNKNOWN: G_CBOE_MONTHLY_ROLL_DATE_UNKNOWN
    - gate_id: G-CBOE-SPX-REF-BEFORE-1100
      predicate: exists S_ref = last disseminated SPX value with timestamp < 11:00:00 ET on roll date
      operator: timestamp strictly before 11:00 ET
      threshold: 11:00 a.m. ET
      units: timestamp (America/New_York)
      boundary: exclusive of 11:00:00
      unknown_behavior: no index observation before 11:00 ET on the roll date, or the observation is after 11:00
        ET (stale/late evidence)
      reason_codes: &id003
        FAIL: G_CBOE_SPX_REF_BEFORE_1100_FAIL
        UNKNOWN: G_CBOE_SPX_REF_BEFORE_1100_UNKNOWN
    - gate_id: G-PUT-STRIKE-EXISTS
      predicate: 'exists c: type=PUT, root=SPX monthly AM-settled (X01), expiration = next monthly expiration, K(c)
        <= S_ref'
      operator: <=
      threshold: S_ref
      units: index points
      boundary: inclusive (closest to but not greater than)
      unknown_behavior: chain unavailable or root/settlement identity unknown (X01)
      reason_codes: &id004
        FAIL: G_PUT_STRIKE_EXISTS_FAIL
        UNKNOWN: G_PUT_STRIKE_EXISTS_UNKNOWN
    structure_primitive: P01 single short put
    leg_selection: 'K* = max{K(c): c in U_t, K(c) <= S_ref}; expiration = next standard monthly SPX expiration;
      one short put leg (unique by construction)'
    entry_timing: roll date (DF-THIRD-FRIDAY-ROLL-DATE); strike fixed from S_ref before 11:00 ET; sold at trade
      VWAP 11:30-12:00 ET (last bid before 12:00 if no trades)
    exit_timing: hold to expiration; settle max(0, K_old - SOQ) on next roll date
    roll_behavior: 'same roll date after settlement: write new put per leg rule'
    sizing: 'fully collateralized: third roll dates N_new = (sum_i (1+r_i)M_i - N_last*max(0,K_old-SOQ)) / (K_new/(1+R3)
      - P_price); other roll dates eq. (8)-(14) (DF-CBOE-PUT-CONTRACT-COUNT); account capital M is a Founder capital
      decision'
    capital_collateral: cash-secured in 1-month and 3-month T-bills; no leverage; ASA max-loss model must not replace
      this collateral rule (A15 representation)
    transaction_costs: entry at trade VWAP (source cost treatment); SOQ cash settlement; no commissions/taxes; net-of-cost
      evidence UNKNOWN
    lifecycle: roll -> short put held -> SOQ settlement -> roll (continuous monthly; one series at a time; no targets/stops)
    verdict_truth_table:
    - - ROLL=FAIL
      - '*'
      - '*'
      - NO_ACTION
    - - ROLL=UNKNOWN
      - '*'
      - '*'
      - UNKNOWN
    - - PASS
      - REF=UNKNOWN
      - '*'
      - UNKNOWN
    - - PASS
      - PASS
      - STRIKE=UNKNOWN
      - UNKNOWN
    - - PASS
      - PASS
      - PASS
      - PASS (write)
    required_existing_capabilities:
    - OPTION_CHAIN_V1
    - REAL_TIME_QUOTE_V1
    - TRADING_CALENDAR_V1
    - asa.stonk.shared verdict_classifier
    - asa.core compare/boolean_and/constant
    required_missing_reusable_capabilities:
    - X01
    - INDEX_QUOTE
    - P01
    - X04
    - A15
    - X05
    architect_decisions_required:
    - X05 contract
    - A15 collateral representation
    - INDEX quote path
    implementation_assumptions_separated_from_sourced_rules:
    - 'IA-PUT-01 contract rounding: implementation may round N to whole contracts only as a disclosed assumption;
      the source index uses fractional N'
    unresolved:
      DATA:
      - X05 option trade tape for VWAP entry price (outcome valuation)
      - SOQ availability (X01)
      - Treasury bank-discount rates (X04)
      - INDEX quote before 11:00 ET (X01 INDEX quote path)
      ARCHITECTURE:
      - A15 representation of cash-secured T-bill collateral
      - fractional N vs whole contracts (implementation assumption, disclosed; index definition is fractional)
      RESEARCH:
      - net-of-cost replication evidence (evidence, not rule)
