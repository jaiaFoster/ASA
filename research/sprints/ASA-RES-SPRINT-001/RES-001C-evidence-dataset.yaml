# ASA-RES-SPRINT-001 / RES-001C comparable evidence dataset. Generated from family dossiers; see RES-001D for permitted use.
dataset_id: ASA-RES-SPRINT-001-RES-001C
version: '1.0'
created_at: '2026-09-26'
purpose: Standardized, traceable coding of family-level evidence records for downstream comparison (RES-001D).
  Not a ranking and not a selection input by itself.
authority_note: Codings are ROLE-RESEARCH evidence characterization (DECIDE). They are DERIVED from the
  cited dossiers and source records, or INFERENCE where noted. No weights, scores or rankings are defined
  here.
independence_rule: Evidence codings (evidence.*, specification.rule_precision) were assigned before, and
  without reference to, implementation codings (implementation.*). ASA convenience does not affect evidence
  codings.
unknown_rule: UNKNOWN or 'none'/'none_found' means absence of recovered evidence, never a zero or a negative
  finding. See RES-001D missing-data policy.
vocabulary:
  source_quality_tier:
  - peer_reviewed
  - peer_reviewed_plus_institutional
  - peer_reviewed_unassessed
  - working_paper_and_institutional
  - institutional_sponsor_and_practitioner_only
  - practitioner_only
  - internal_specification_with_component_literature
  post_publication_direction:
  - positive
  - mixed
  - negative
  - none_found
  net_of_cost_evidence:
  - positive
  - mixed
  - negative
  - none (not recovered)
  rule_precision:
  - explicit (benchmark or fully specified rule)
  - partial (core signal specified, execution/filters UNKNOWN)
  - vague (family concept only)
  execution_burden:
  - low
  - low_medium
  - medium
  - medium_high
  - high
  - very_high
  tail_risk_class:
  - bounded
  - moderate
  - severe
  - protective
  - low
  - expression_dependent
  n_primary_peer_reviewed_sources: count of distinct cited sources whose source record has source_type
    peer_reviewed (DERIVED mechanically; practitioner journals such as FAJ/JPM/JAI appear as institutional_quant_research
    when authored by institutions and are not counted)
  n_independent_replications: count of sources in the dossier's 'Independent replications' section (DERIVED);
    same-author extensions excluded
  verification_depth_counts: count of cited sources by verification_depth (DERIVED from source records)
  unknown_comparison_fields: RES-001C comparison fields whose dossier value begins with UNKNOWN (DERIVED
    mechanically). Fields that are only partly UNKNOWN are not counted, so this undercounts uncertainty;
    use as a lower bound.
